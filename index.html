['Pasta mit Burrata','Mittagessen',25,8,'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=900&q=80','Vegetarisch','Milch,Gluten','Pasta:120:g|Tomaten:200:g|Burrata:100:g','Pasta kochen|Tomaten in Pfanne garen|Mit Burrata anrichten'],
['Zitronenrisotto','Mittagessen',35,8,'https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=900&q=80','Vegetarisch','Milch','Risottoreis:100:g|Parmesan:30:g|Zitrone:1:Stück|Gemüsebouillon:300:ml','Reis in Bouillon portionsweise garen|Zitronenabrieb zugeben|Parmesan unterrühren'],
['Gemüse-Reispfanne','Mittagessen',25,6,'https://images.unsplash.com/photo-1512058564366-18510be2db19?w=900&q=80','Vegan','','Reis:110:g|Peperoni:1:Stück|Zucchetti:160:g','Reis kochen|Gemüse schneiden und braten|Alles vermischen'],
['Poulet-Fajitas','Mittagessen',30,11,'https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=900&q=80','Fleisch','Gluten','Pouletbrust:170:g|Tortillas:2:Stück|Peperoni:1:Stück|Avocado:1:Stück','Poulet vollständig durchgaren|Gemüse braten|Tortillas füllen'],
['Tomaten-Gnocchi','Mittagessen',25,7,'https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=900&q=80','Vegetarisch','Gluten,Milch','Gnocchi:220:g|Tomaten:170:g|Mozzarella:90:g','Gnocchi garen|Tomaten erwärmen|Mit Mozzarella mischen'],
['Thai-Gemüsecurry','Abendessen',35,9,'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=900&q=80','Vegan','','Kokosmilch:200:ml|Reis:110:g|Broccoli:150:g|Karotten:120:g','Reis kochen|Gemüse mit Kokosmilch köcheln|Zusammen servieren'],
['Ofenpoulet mit Kartoffeln','Abendessen',45,12,'https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=900&q=80','Fleisch','','Pouletbrust:180:g|Kartoffeln:250:g|Karotten:130:g','Ofen auf 200 Grad vorheizen|Gemüse im Ofen garen|Poulet vollständig durchgaren'],
['Lachs mit Gemüse','Abendessen',30,14,'https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=900&q=80','Fisch','Fisch','Lachs:180:g|Broccoli:170:g|Kartoffeln:230:g','Kartoffeln kochen|Broccoli dämpfen|Lachs vollständig garen'],
['Vegetarische Lasagne','Abendessen',50,10,'https://images.unsplash.com/photo-1574894709920-11b28e7367e3?w=900&q=80','Vegetarisch','Gluten,Milch','Lasagneblätter:100:g|Tomatensauce:200:g|Zucchetti:140:g|Mozzarella:90:g','Gemüse schneiden|Zutaten in Form schichten|Im Ofen durchbacken'],
['Tofu mit Reis','Abendessen',30,8,'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=900&q=80','Vegan','Soja','Tofu:170:g|Reis:110:g|Broccoli:170:g','Reis kochen|Broccoli garen|Tofu anbraten'],
['Schokoladenmousse','Dessert',20,5,'https://images.unsplash.com/photo-1511715282680-fbf93a50e721?w=900&q=80','Vegetarisch','Milch','Schokolade:60:g|Rahm:120:ml','Schokolade vorsichtig schmelzen|Rahm steif schlagen|Vermischen und kalt stellen'],
['Beeren-Crêpes','Dessert',25,5,'https://images.unsplash.com/photo-1519676867240-f03562e64548?w=900&q=80','Vegetarisch','Gluten,Milch,Eier','Mehl:80:g|Milch:150:ml|Eier:1:Stück|Beeren:100:g','Teig verrühren|Crêpes ausbacken|Mit Beeren servieren'],
['Fruchtsalat','Dessert',10,4,'https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?w=900&q=80','Vegan','','Apfel:1:Stück|Banane:1:Stück|Beeren:100:g','Früchte waschen|Schneiden und mischen|Frisch servieren'],
['Vanillejoghurt mit Beeren','Dessert',8,4,'https://images.unsplash.com/photo-1488477181946-6428a0291777?w=900&q=80','Vegetarisch','Milch','Joghurt:180:g|Beeren:120:g|Vanillezucker:10:g','Joghurt mit Vanillezucker mischen|Beeren darübergeben']
].map((x,i)=>({id:i+1,name:x[0],meal:x[1],min:x[2],cost:x[3],img:x[4],diet:x[5],allergens:x[6]?x[6].split(','):[],ingredients:x[7].split('|').map(y=>{let a=y.split(':');return {name:a[0],qty:+a[1],unit:a[2]}}),steps:x[8].split('|')}));
const defaults={setup:false,name:'',diet:'Alles',allergies:[],dislikes:[],cuisines:[],store:'Coop',people:2,days:[...DAYS],meals:['Mittagessen','Abendessen'],budget:180,occasion:'Kein besonderer Anlass',occasionDay:'Samstag',weekStart:'',plan:{},lastLiked:[],liked:[],skipped:[],checks:{},history:[]};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem('mealio-v1')||'{}')}}catch(e){data={...defaults}};let view=data.setup?'home':'intro',step=0,flow='intro',category=0,cardIndex=0,recipeId=null,assignKey=null,arrangeMode='auto',chosenDate=null;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem('mealio-v1',JSON.stringify(data)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&#39;'}[c])),fmt=n=>'CHF '+Number(n).toFixed(2),button=(text,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${text}</button>`;
function monday(date=new Date()){let d=new Date(date.getFullYear(),date.getMonth(),date.getDate()),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d}
function dateISO(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fromISO(s){let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function dateLabel(s){let d=fromISO(s),e=new Date(d);e.setDate(d.getDate()+6);return d.toLocaleDateString('de-CH',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('de-CH',{day:'numeric',month:'short',year:'numeric'})}
function weekEnd(){if(!data.weekStart)return null;let d=fromISO(data.weekStart);d.setDate(d.getDate()+6);return d}
function safe(r){if(r.allergens.some(a=>data.allergies.includes(a)))return false;if(data.diet==='Vegetarisch'&&['Fleisch','Fisch'].includes(r.diet))return false;if(data.diet==='Vegan'&&r.diet!=='Vegan')return false;if(data.diet==='Laktosefrei'&&r.allergens.includes('Milch'))return false;if(data.diet==='Glutenfrei'&&r.allergens.includes('Gluten'))return false;let n=(r.name+' '+r.ingredients.map(i=>i.name).join(' ')).toLowerCase();return !data.dislikes.some(d=>n.includes(d.toLowerCase()))}
function setValue(k,v){data[k]=v;save();render()}
function toggleValue(k,v){
let a=data[k]||[];
data[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v];
save();render();
}
function choices(k,items){
return items.map(v=>`<button class="chip ${(data[k]||[]).includes(v)?'active':''}" onclick="toggleValue('${k}','${v}')">${esc(v)}</button>`).join('');
}
function chooseOne(k,items){
return items.map(v=>`<button class="choice ${data[k]===v?'active':''}" onclick="setValue('${k}','${v}')">${esc(v)} ${data[k]===v?'✓':''}</button>`).join('');
}
function topProgress(current,total){
return `<div class="eyebrow">Schritt ${current+1} von ${total}</div><div class="progress"><div style="width:${(current+1)/total*100}%"></div></div>`;
}
function navigation(back,next,last=false){
return `<div class="row" style="margin-top:22px">
${button('← Zurück',back,'outline')}
${button(last?'Fertig ✓':'Weiter →',next,'grow')}
</div>`;
}
function openSettings(){view='settings';render()}
function go(v){view=v;recipeId=null;render()}
function startIntro(){flow='intro';step=0;view='wizard';render()}
function startWeek(){
flow='week';step=0;view='wizard';
let base=monday();
if(data.weekStart){
let next=fromISO(data.weekStart);
next.setDate(next.getDate()+7);
if(next>base)base=next;
}
data.pendingWeek=dateISO(base);
data.liked=[];
data.skipped=[];
save();render();
}
function introSteps(){
return [
['Willkommen bei Mealio','Wie dürfen wir dich nennen?'],
['Deine Ernährung','Welche Ernährungsform passt zu dir?'],
['Allergien','Welche Allergien oder Unverträglichkeiten hast du?'],
['Was magst du nicht?','Diese Zutaten versuchen wir zu vermeiden.'],
['Deine Lieblingsküchen','Welche Küchen gefallen dir besonders?']
];
}
function weekSteps(){
return [
['Dein Supermarkt','Wo möchtest du diese Woche einkaufen?'],
['Personenanzahl','Für wie viele Personen kochst du?'],
['Wochentage','An welchen Tagen möchtest du Gerichte planen?'],
['Mahlzeiten','Welche Mahlzeiten sollen eingeplant werden?'],
['Dein Budget','Wie viel möchtest du für diese Woche ausgeben?'],
['Besondere Anlässe','Gibt es ein besonderes Essen in dieser Woche?'],
['Deine Rezepte','Möchtest du bisherige oder neue Rezepte?']
];
}
function wizard(){
let intro=flow==='intro';
let steps=intro?introSteps():weekSteps();
let content='';
if(intro){
switch(step){
case 0:
content=`<label class="field">Dein Vorname</label><input id="nameInput" value="${esc(data.name)}" placeholder="Dein Vorname" oninput="data.name=this.value;save()">`;
break;
case 1:
content=chooseOne('diet',['Alles','Vegetarisch','Vegan','Laktosefrei','Glutenfrei']);
break;
case 2:
content=choices('allergies',['Milch','Gluten','Eier','Fisch','Soja','Nüsse','Sesam']);
content+=`<p class="note">Wichtig: Die Rezeptdatenbank ist eine Demo. Die Allergieprüfung ist nicht vollständig und ersetzt niemals die Kontrolle der Zutaten und Verpackungen.</p>`;
break;
case 3:
content=choices('dislikes',['Fisch','Lachs','Poulet','Schweinefleisch','Rindfleisch','Tofu','Pilze','Zwiebeln','Eier','Broccoli','Karotten','Tomaten']);
break;
case 4:
content=choices('cuisines',['Italienisch','Schweizerisch','Asiatisch','Mexikanisch','Mediterran','Indisch','Französisch','International']);
break;
}
}else{
switch(step){
case 0:
content=chooseOne('store',STORES);
break;
case 1:
content=`<div class="row" style="justify-content:center;margin:30px 0">
${button('−',"setValue('people',Math.max(1,data.people-1))",'outline')}
<div class="count">${data.people}</div>
${button('+',"setValue('people',Math.min(20,data.people+1))",'outline')}
</div><p class="muted" style="text-align:center">Personen</p>`;
break;
case 2:
content=choices('days',DAYS);
break;
case 3:
content=choices('meals',MEALS);
break;
case 4:
content=`<div class="count">${fmt(data.budget)}</div>
<input class="range" type="range" min="30" max="800" step="10" value="${data.budget}" oninput="document.getElementById('budgetDisplay').textContent='CHF '+this.value" onchange="setValue('budget',Number(this.value))">
<p id="budgetDisplay" class="muted" style="text-align:center">CHF ${data.budget}</p>
<p class="note">Das Budget wird mit geschätzten Rezeptkosten verglichen. Es handelt sich nicht um aktuelle Preise von ${esc(data.store)}.</p>`;
break;
case 5:
content=chooseOne('occasion',['Kein besonderer Anlass','Weihnachtsessen','Geburtstag','Gäste eingeladen','Festessen','Anderer Anlass']);
if(data.occasion!=='Kein besonderer Anlass'){
content+=`<label class="field">An welchem Tag?</label><select onchange="setValue('occasionDay',this.value)">${DAYS.map(d=>`<option ${data.occasionDay===d?'selected':''}>${d}</option>`).join('')}</select>`;
}
break;
case 6:
content=`<button class="choice" onclick="sameRecipes()">
<b>🔁 Gleiche Rezepte</b><br>
<small>Gerichte aus deinem bisherigen Wochenplan übernehmen.</small>
</button>
<button class="choice" onclick="newRecipes()">
<b>✨ Neue Rezepte</b><br>
<small>Neue Gerichte mit Bildern durch Wischen auswählen.</small>
</button>`;
break;
}
}
let back=step===0?(intro?"view='intro';render()":"view='home';render()"):"step--;render()";
let next=step===steps.length-1?(intro?"finishIntro()":"newRecipes()"):"nextWizard()";
return `<div class="card">
${topProgress(step,steps.length)}
<h1>${steps[step][0]}</h1>
<p class="muted">${steps[step][1]}</p>
<div class="spacer"></div>
${content}
${step===6&&!intro?button('← Zurück',"step--;render()",'outline'):navigation(back,next,step===steps.length-1)}
</div>`;
}
function nextWizard(){
if(flow==='intro'&&step===0&&!data.name.trim()){
alert('Bitte gib zuerst deinen Vornamen ein.');return;
}
if(flow==='week'&&step===2&&data.days.length===0){
alert('Bitte wähle mindestens einen Wochentag.');return;
}
if(flow==='week'&&step===3&&data.meals.length===0){
alert('Bitte wähle mindestens eine Mahlzeit.');return;
}
step++;render();
}
function finishIntro(){
data.setup=true;save();startWeek();
}
function newRecipes(){
data.liked=[];data.skipped=[];
category=0;cardIndex=0;
view='swipe';save();render();
}
function sameRecipes(){
let old=data.lastLiked||[];
if(!old.length){
alert('Du hast noch keine Rezepte aus einer früheren Woche. Wähle zuerst neue Rezepte aus.');
newRecipes();return;
}
data.liked=[...old];data.skipped=[];
save();view='arrange';render();
}
function activeMeals(){
return MEALS.filter(m=>data.meals.includes(m));
}
function swipeCategories(){
return activeMeals().map(m=>({
name:m,
recipes:R.filter(r=>r.meal===m&&safe(r))
}));
}
function swipe(){
let cats=swipeCategories();
if(!cats.length)return `<div class="card"><h2>Keine Mahlzeiten ausgewählt</h2>${button('Zurück',"view='wizard';step=3;render()")}</div>`;
if(category>=cats.length){view='arrange';return arrange();}
let cat=cats[category];
if(cardIndex>=cat.recipes.length){
category++;cardIndex=0;return swipe();
}
let r=cat.recipes[cardIndex];
return `<div class="card">
<div class="eyebrow">Neue Rezepte entdecken</div>
${topProgress(category,cats.length)}
<h2>${esc(cat.name)}</h2>
<p class="muted">Wische nach rechts für „Gefällt mir“ und nach links für „Nein“.</p>
<p class="muted">Rezept ${cardIndex+1} von ${cat.recipes.length}</p>
<div class="recipe-card" id="swipeCard">
<img class="photo" src="${r.img}" alt="${esc(r.name)}" onerror="this.style.display='none'">
<div class="recipe-body">
<div class="badge">${esc(r.meal)} · ${r.min} Minuten</div>
<h2>${esc(r.name)}</h2>
<p>Geschätzte Kosten pro Person: ${fmt(r.cost)}</p>
${button('Rezeptdetails',"recipeId="+r.id+";view='details';render()",'outline full')}
</div></div>
<div class="row">
${button('✕ Nein',"rateRecipe(false)",'outline grow')}
${button('♥ Gefällt mir',"rateRecipe(true)",'grow')}
</div>
<p class="muted" style="text-align:center">${data.liked.length} Rezepte gefallen dir bisher.</p>
${button('← Zurück',"backSwipe()",'ghost')}
</div>`;
}
function rateRecipe(yes){
let cats=swipeCategories();
if(category>=cats.length)return;
let r=cats[category].recipes[cardIndex];
if(!r)return;
if(yes){
if(!data.liked.includes(r.id))data.liked.push(r.id);
}else{
if(!data.skipped.includes(r.id))data.skipped.push(r.id);
}
cardIndex++;
if(cardIndex>=cats[category].recipes.length){
category++;cardIndex=0;
}
save();
if(category>=cats.length)view='arrange';
render();
}
function backSwipe(){
if(cardIndex>0)cardIndex--;
else if(category>0){
category--;
cardIndex=Math.max(0,swipeCategories()[category].recipes.length-1);
}else{
view='wizard';step=6;
}
render();
}
function arrange(){
let selected=R.filter(r=>data.liked.includes(r.id));
return `<div class="card">
<div class="eyebrow">Letzter Schritt</div>
<div class="progress"><div style="width:100%"></div></div>
<h1>Deine Rezepte sind ausgewählt! 🎉</h1>
<p>Dir gefallen <b>${selected.length} Rezepte</b>.</p>
${selected.length===0?'<p class="note">Du hast noch keine Rezepte ausgewählt. Gehe zurück und markiere mindestens ein Gericht mit „Gefällt mir“.</p>':''}
<h2>Wer soll die Rezepte anordnen?</h2>
<button class="choice" onclick="finishPlan('auto')" ${selected.length?'':'disabled'}>
<b>✨ Mealio ordnet automatisch</b><br>
<small>Mealio verteilt deine ausgewählten Gerichte auf die gewählten Tage.</small>
</button>
<button class="choice" onclick="finishPlan('manual')" ${selected.length?'':'disabled'}>
<b>📅 Ich ordne selbst</b><br>
<small>Du entscheidest, welches Gericht an welchem Tag gegessen wird.</small>
</button>
${button('← Zurück zu den Rezepten',"view='swipe';category=0;cardIndex=0;render()",'outline')}
</div>`;
}
function planSlots(){
let out=[];
DAYS.filter(d=>data.days.includes(d)).forEach(day=>{
activeMeals().forEach(meal=>out.push({day,meal,key:day+'|'+meal}));
});
return out;
}
function finishPlan(mode){
if(!data.liked.length){
alert('Bitte wähle mindestens ein Rezept.');return;
}
arrangeMode=mode;
data.plan={};
let counts={};
if(mode==='auto'){
planSlots().forEach(slot=>{
let pool=R.filter(r=>data.liked.includes(r.id)&&r.meal===slot.meal);
if(pool.length){
let i=counts[slot.meal]||0;
data.plan[slot.key]=pool[i%pool.length].id;
counts[slot.meal]=i+1;
}
});
}
data.weekStart=data.pendingWeek||dateISO(monday());
data.lastLiked=[...data.liked];
data.checks={};
save();
view=mode==='manual'?'manual':'plan';
render();
}
function manualPlan(){
return `<div class="card">
<h1>📅 Rezepte selbst verteilen</h1>
<p>Tippe auf eine Mahlzeit und wähle eines deiner Lieblingsrezepte aus.</p>
${planSlots().map(slot=>{
let r=R.find(x=>x.id===data.plan[slot.key]);
return `<div class="mini">
<div class="grow"><b>${slot.day}</b><br><small>${slot.meal}</small><br>${r?esc(r.name):'Noch kein Rezept'}</div>
${button('Auswählen',"assignKey='"+slot.key+"';view='assign';render()",'outline')}
</div>`;
}).join('')}
${button('Wochenplan fertigstellen',"view='plan';render()",'full')}
</div>`;
}
function assign(){
let meal=assignKey.split('|')[1];
let pool=R.filter(r=>data.liked.includes(r.id)&&r.meal===meal);
return `<div class="card">
<h2>${esc(assignKey.replace('|',' · '))}</h2>
${pool.map(r=>`<button class="choice" onclick="data.plan[assignKey]=${r.id};save();view='manual';render()">
<b>${esc(r.name)}</b><br><small>${r.min} Minuten</small>
</button>`).join('')||'<p>Für diese Mahlzeit wurde noch kein Rezept ausgewählt.</p>'}
${button('← Zurück',"view='manual';render()",'outline')}
</div>`;
}


function estimatedTotal(){
return Object.values(data.plan).reduce((sum,id)=>{
let r=R.find(x=>x.id===id);
return sum+(r?r.cost*data.people:0);
},0);
}
function shoppingItems(){
let result={};
Object.values(data.plan).forEach(id=>{
let r=R.find(x=>x.id===id);
if(!r)return;
r.ingredients.forEach(i=>{
let key=i.name+'|'+i.unit;
if(!result[key])result[key]={name:i.name,unit:i.unit,qty:0};
result[key].qty+=i.qty*data.people;
});
});
return Object.entries(result).sort((a,b)=>a[1].name.localeCompare(b[1].name,'de'));
}
function currentReminder(){
if(!data.weekStart)return '';
let end=weekEnd();
let today=new Date();
today.setHours(0,0,0,0);
let diff=Math.round((end-today)/86400000);
if(diff>2)return '';
return `<div class="card reminder">
<h3>🔔 Deine Woche endet bald</h3>
<p>${diff<0?'Dein letzter Wochenplan ist abgelaufen.':'Dein Essensplan endet am Sonntag. Plane jetzt die nächste Woche.'}</p>
${button('Nächste Woche planen',"startWeek()",'full')}
</div>`;
}
function home(){
let hasPlan=Object.keys(data.plan).length>0;
return `<div class="card">
<div class="eyebrow">Dein persönlicher Essensplan</div>
<h1>Hallo, ${esc(data.name||'du')}! 👋</h1>
<p>Willkommen bei Mealio.</p>
${hasPlan?`<div class="stat">
<b>📅 ${dateLabel(data.weekStart)}</b><br>
<small>${esc(data.store)} · ${data.people} Personen</small>
</div>`:'<p>Du hast noch keinen Wochenplan erstellt.</p>'}
</div>
${hasPlan?currentReminder():''}
<div class="grid">
<div class="card" style="margin:0">
<h3>📅 Wochenplan</h3>
<p class="muted">Alle Gerichte deiner Woche</p>
${button('Öffnen',"go('plan')",'full')}
</div>
<div class="card" style="margin:0">
<h3>🛒 Einkauf</h3>
<p class="muted">Deine Einkaufsliste</p>
${button('Öffnen',"go('shop')",'full')}
</div>
</div>
<div class="spacer"></div>
<div class="card">
<h2>Deine nächste Woche</h2>
<p>Plane neue Mahlzeiten. Deine Allergien und Vorlieben bleiben gespeichert.</p>
${button('Neue Woche planen',"startWeek()",'full')}
</div>
<div class="card">
<h3>Dein Budget</h3>
<div class="grid">
<div class="stat"><small>Budget</small><h2>${fmt(data.budget)}</h2></div>
<div class="stat"><small>Geschätzte Kosten</small><h2>${fmt(estimatedTotal())}</h2></div>
</div>
<p class="muted">Die Kosten sind Richtwerte, keine aktuellen Ladenpreise.</p>
</div>`;
}
function planPage(){
if(!data.weekStart)return `<div class="card"><h2>Kein Wochenplan vorhanden</h2>${button('Jetzt planen',"startWeek()")}</div>`;
return `<div class="card">
<div class="eyebrow">Dein Wochenplan</div>
<h1>📅 ${dateLabel(data.weekStart)}</h1>
<p>${esc(data.store)} · ${data.people} Personen</p>
<div class="grid">
<div class="stat"><small>Budget</small><h3>${fmt(data.budget)}</h3></div>
<div class="stat"><small>Rezeptkosten</small><h3>${fmt(estimatedTotal())}</h3></div>
</div>
${data.occasion!=='Kein besonderer Anlass'?`<p>🎉 ${esc(data.occasion)} am ${esc(data.occasionDay)}</p>`:''}
</div>
${DAYS.filter(d=>data.days.includes(d)).map(day=>`
<div class="card day">
<h2>${day}</h2>
${activeMeals().map(meal=>{
let key=day+'|'+meal;
let r=R.find(x=>x.id===data.plan[key]);
return `<div class="mini">
${r?`<img src="${r.img}" alt="${esc(r.name)}">`:''}
<div class="grow">
<div class="badge">${meal}</div>
<b>${r?esc(r.name):'Noch kein Rezept'}</b>
${r?`<br><small>${r.min} Minuten</small>`:''}
</div>
${r?button('Ansehen',"recipeId="+r.id+";view='details';render()",'outline'):button('Wählen',"assignKey='"+key+"';view='assign';render()",'outline')}
</div>`;
}).join('')}
</div>`).join('')}
<div class="card">
${button('🛒 Einkaufsliste öffnen',"go('shop')",'full')}
<div class="spacer"></div>
${button('Neue Woche planen',"startWeek()",'outline full')}
</div>`;
}
function detailsPage(){
let r=R.find(x=>x.id===recipeId);
if(!r)return `<div class="card"><h2>Rezept nicht gefunden</h2>${button('Zurück',"go('plan')")}</div>`;
return `<div class="recipe-card">
<img class="photo" src="${r.img}" alt="${esc(r.name)}" onerror="this.style.display='none'">
<div class="recipe-body">
<div class="eyebrow">${esc(r.meal)}</div>
<h1>${esc(r.name)}</h1>
<p>⏱️ ${r.min} Minuten · 👥 ${data.people} Personen</p>
<p>Geschätzte Kosten: ${fmt(r.cost*data.people)}</p>
<h2>Zutaten</h2>
${r.ingredients.map(i=>`<div class="mini"><span class="grow">${esc(i.name)}</span><b>${i.qty*data.people} ${esc(i.unit)}</b></div>`).join('')}
<h2>Zubereitung</h2>
<ol>${r.steps.map(s=>`<li style="padding:7px 0;line-height:1.5">${esc(s)}</li>`).join('')}</ol>
<div class="note">Erfasste Allergene: ${r.allergens.length?r.allergens.map(esc).join(', '):'keine angegeben'}. Die Angaben sind nicht vollständig verifiziert. Bitte Zutaten und Verpackungen selbst kontrollieren.</div>
<div class="spacer"></div>
${button('← Zurück',view==='details'?"view=data.weekStart?'plan':'swipe';render()":"go('plan')",'outline full')}
</div></div>`;
}
function shopPage(){
let items=shoppingItems();
return `<div class="card">
<div class="eyebrow">Dein Einkauf</div>
<h1>🛒 Einkaufsliste</h1>
<p>${esc(data.store)} · ${data.people} Personen</p>
<p>Geschätzte Rezeptkosten: <b>${fmt(estimatedTotal())}</b></p>
<p class="note">Die Liste basiert auf den geplanten Rezepten. Verpackungsgrössen und tatsächliche Preise können abweichen.</p>
${items.length?items.map(([key,i])=>`
<label class="check ${data.checks[key]?'done':''}">
<input type="checkbox" ${data.checks[key]?'checked':''} onchange="data.checks['${esc(key)}']=this.checked;save();render()">
<span class="grow">${esc(i.name)}</span>
<b>${i.qty} ${esc(i.unit)}</b>
</label>`).join(''):'<p>Deine Einkaufsliste ist noch leer. Plane zuerst deine Rezepte.</p>'}
<div class="spacer"></div>
${button('📋 Liste kopieren',"copyShopping()",'full')}
<div class="spacer"></div>
${button('🖨️ Drucken / als PDF sichern',"window.print()",'outline full')}
</div>`;
}
function copyShopping(){
let lines=shoppingItems().map(([key,i])=>`${i.name}: ${i.qty} ${i.unit}`);
let text='Mealio Einkaufsliste\n'+data.store+'\n\n'+lines.join('\n');
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(()=>alert('Einkaufsliste kopiert!')).catch(()=>prompt('Liste kopieren:',text));
}else prompt('Liste kopieren:',text);
}
function settingsPage(){
return `<div class="card">
<div class="eyebrow">Deine persönlichen Einstellungen</div>
<h1>⚙️ Einstellungen</h1>
<p class="muted">Diese Angaben werden gespeichert und müssen nicht jede Woche neu eingegeben werden.</p>
<label class="field">Dein Vorname</label>
<input value="${esc(data.name)}" oninput="data.name=this.value;save()">
<h3>Ernährungsform</h3>
${chooseOne('diet',['Alles','Vegetarisch','Vegan','Laktosefrei','Glutenfrei'])}
<h3>Allergien</h3>
${choices('allergies',['Milch','Gluten','Eier','Fisch','Soja','Nüsse','Sesam'])}
<h3>Das mag ich nicht</h3>
${choices('dislikes',['Fisch','Lachs','Poulet','Schweinefleisch','Rindfleisch','Tofu','Pilze','Zwiebeln','Eier','Broccoli','Karotten','Tomaten'])}
<h3>Lieblingsküchen</h3>
${choices('cuisines',['Italienisch','Schweizerisch','Asiatisch','Mexikanisch','Mediterran','Indisch','Französisch','International'])}
<p class="note">Allergie- und Ernährungsfilter sind nur eine vereinfachte Demo und keine medizinisch zuverlässige Prüfung.</p>
${button('✓ Einstellungen speichern',"save();go('home')",'full')}
</div>`;
}
function introPage(){
return `<div class="card" style="text-align:center;padding:35px 20px">
<div style="font-size:65px">🌿</div>
<h1>Willkommen bei Mealio</h1>
<p>Dein persönlicher Essensplan mit leckeren Rezepten, Wochenplanung und Einkaufsliste.</p>
<p class="muted">Einmal deine Vorlieben einstellen. Jede Woche neue Gerichte entdecken.</p>
${button('Jetzt starten',"startIntro()",'full')}
</div>`;
}
function render(){
let app=$('app');
let nav=$('nav');
nav.classList.toggle('hidden',!data.setup||['wizard','swipe','arrange','manual','assign','details'].includes(view));
let pages={
intro:introPage,
wizard,
swipe,
arrange,
manual:manualPlan,
assign,
home,
plan:planPage,
details:detailsPage,
shop:shopPage,
settings:settingsPage
};
app.innerHTML=(pages[view]||home)();
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
let active=$('nav-'+view);
if(active)active.classList.add('active');
window.scrollTo(0,0);
if(view==='swipe')enableSwipe();
}
function enableSwipe(){
let el=$('swipeCard');
if(!el)return;
let startX=0,startY=0;
el.addEventListener('touchstart',e=>{
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
},{passive:true});
el.addEventListener('touchend',e=>{
let dx=e.changedTouches[0].clientX-startX;
let dy=e.changedTouches[0].clientY-startY;
if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3){
rateRecipe(dx>0);
}
},{passive:true});
}
if(!data.weekStart&&data.setup)view='home';
render();
</script>
</body>
</html>
