
<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19764c"><title>Mealio – Dein Wochenplan</title><style>
:root{--green:#19764c;--ink:#193d2a;--bg:#f3f8f4;--muted:#64786a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e0e9e1;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}.logo{font-size:25px;font-weight:800;color:var(--green)}main{max-width:680px;margin:auto;padding:18px 14px 110px}.card{background:white;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 3px 14px #12341b0a}h1{font-size:26px;margin:9px 0 12px}h2{font-size:21px}h3{font-size:17px}p{line-height:1.5}.muted,small{color:var(--muted)}.eyebrow{color:var(--green);font-size:12px;letter-spacing:1px;font-weight:800;text-transform:uppercase}button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:var(--green);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}.alt{background:#e7f2e9;color:var(--green)}.ghost{background:transparent;color:var(--green)}.full{width:100%}.row{display:flex;gap:9px;align-items:center}.grow{flex:1;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:block;width:100%;text-align:left;background:#f8fbf8;color:var(--ink);border:2px solid #e0eae1;margin:9px 0;padding:14px}.choice.active{background:#e7f5eb;border-color:var(--green)}.chip{display:inline-block;background:white;color:var(--ink);border:1px solid #d4e4d7;border-radius:25px;padding:10px 12px;margin:4px;font-weight:500}.chip.active{background:#dff2e4;border-color:var(--green)}input,select{font:inherit;width:100%;padding:12px;border:1px solid #ceded1;border-radius:11px}input[type=range],input[type=checkbox]{accent-color:var(--green)}label.field{display:block;font-weight:700;margin:15px 0 7px}.progress{height:7px;background:#e1ece3;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--green)}.photo{width:100%;height:235px;object-fit:cover;background:#e3eee5;display:block}.recipe{border:1px solid #e1eae3;border-radius:17px;overflow:hidden;margin:13px 0}.recipebody{padding:16px}.mini{display:flex;align-items:center;gap:11px;border-bottom:1px solid #edf1ed;padding:12px 0}.mini img{width:76px;height:67px;object-fit:cover;border-radius:10px}.stat{background:#eff7f0;padding:13px;border-radius:13px}.note{background:#fff5dc;border-radius:12px;padding:13px;font-size:13px;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce8df;display:flex;padding:8px 5px max(8px,env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;background:transparent;color:#69806e;padding:8px 2px;font-size:12px}.nav button.active{background:#e7f4ea;color:var(--green)}.hidden{display:none!important}.check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ed}.check input{width:22px;height:22px;flex:none}.check.done span{text-decoration:line-through;color:#91a295}.big{font-size:36px;font-weight:800;text-align:center}.empty{padding:16px;border:1px dashed #c8d9cb;border-radius:12px}.badge{color:var(--green);font-size:12px;font-weight:800}.error{background:#fff1ed;color:#8b2b1d;padding:18px;border-radius:12px;white-space:pre-wrap}@media print{header,.nav,button{display:none!important}main{padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style></head><body><header><div class="logo">🌿 Mealio</div><button class="ghost" id="topSettings" aria-label="Einstellungen">⚙️</button></header><main id="app"><div class="card"><h1>🌿 Willkommen bei Mealio</h1><p>Mealio wird geladen …</p><noscript>Bitte aktiviere JavaScript, um Mealio zu öffnen.</noscript></div></main><nav id="nav" class="nav hidden"><button data-nav="home">🏠<br>Start</button><button data-nav="plan">📅<br>Wochenplan</button><button data-nav="shop">🛒<br>Einkauf</button><button data-nav="settings">⚙️<br>Einstellungen</button></nav><script>
'use strict';
const DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MEALS=['Frühstück','Vorspeise','Mittagessen','Abendessen','Dessert'];
const STORES=['Coop','Migros','Lidl','Aldi Suisse','Denner','Volg'];
const DIETS=['Alles','Vegetarisch','Vegan','Laktosefrei','Glutenfrei'];
const ALLERGIES=['Milch','Gluten','Eier','Fisch','Soja','Nüsse','Sesam'];
const DISLIKES=['Fisch','Lachs','Poulet','Schweinefleisch','Rindfleisch','Tofu','Pilze','Zwiebeln','Eier','Broccoli','Karotten','Tomaten'];
const CUISINES=['Italienisch','Schweizerisch','Asiatisch','Mexikanisch','Mediterran','Indisch','Französisch','International'];
const OCCASIONS=['Kein besonderer Anlass','Weihnachtsessen','Geburtstag','Gäste eingeladen','Festessen','Anderer Anlass'];
const raw=[
['Bruschetta','Vorspeise',15,3,'1572695157366-5e585ab2b69f','Vegan','Gluten','Tomaten:150:g|Brot:80:g|Basilikum:8:g',"Wasche die Tomaten, entferne den Stielansatz und schneide sie in etwa 1 cm grosse Würfel.|Gib die Tomaten in eine Schüssel, salze sie leicht und lass sie 5 Minuten ziehen. Wasche und trockne in der Zwischenzeit den Basilikum.|Schneide das Brot in Scheiben und röste es in einer trockenen Pfanne bei mittlerer Hitze 2–3 Minuten pro Seite, bis es goldbraun ist.|Giesse überschüssigen Tomatensaft ab. Mische die Tomaten mit dem gezupften Basilikum und nach Belieben etwas Olivenöl. Verteile sie erst direkt vor dem Servieren auf dem Brot."],
['Caprese mit Burrata','Vorspeise',10,5,'1608897013039-887f21d8c804','Vegetarisch','Milch','Tomaten:180:g|Burrata:100:g|Basilikum:8:g',"Wasche die Tomaten, entferne die Stielansätze und schneide sie in etwa 5 mm dicke Scheiben.|Lege die Scheiben überlappend auf einen Teller. Salze sie leicht und lass sie 5 Minuten ziehen.|Lass die Burrata abtropfen. Setze sie auf die Tomaten und schneide sie auf, damit sich der cremige Kern verteilt.|Wasche und trockne den Basilikum, zupfe die Blätter über den Teller und würze nach Belieben mit Pfeffer und etwas Olivenöl."],
['Karottensuppe','Vorspeise',25,3,'1547592180-85f173990554','Vegan','','Karotten:220:g|Kartoffeln:100:g|Bouillon:250:ml',"Schäle die Karotten und Kartoffeln und schneide sie in etwa 1 cm grosse Stücke.|Bringe die Bouillon im Topf zum Kochen. Gib das Gemüse hinein und reduziere auf mittlere Hitze.|Lass es zugedeckt 15–20 Minuten köcheln, bis sich die Karotten und Kartoffeln mit einer Gabel leicht zerdrücken lassen.|Nimm den Topf vom Herd und püriere die Suppe. Rühre bei Bedarf etwas heisses Wasser ein und schmecke mit Pfeffer und bei Bedarf Salz ab."],
['Bircher-Müesli','Frühstück',10,4,'1517673400267-0251440c45dc','Vegetarisch','Milch,Gluten','Haferflocken:65:g|Joghurt:150:g|Apfel:1:Stück',"Verrühre die Haferflocken mit dem Joghurt und lass sie 5–10 Minuten quellen.|Wasche in der Zwischenzeit den Apfel, viertle ihn und entferne das Kerngehäuse.|Raffle den Apfel grob direkt in die Schüssel und rühre ihn unter die Haferflocken.|Ist das Müesli sehr dick, rühre löffelweise etwas kaltes Wasser ein. Serviere es direkt oder stelle es bis zum Essen in den Kühlschrank."],
['Beeren-Pancakes','Frühstück',20,5,'1528207776546-365bb710ee93','Vegetarisch','Milch,Gluten,Eier','Mehl:90:g|Milch:120:ml|Eier:1:Stück|Beeren:100:g',"Gib das Mehl in eine Schüssel. Verquirle Milch und Ei separat und rühre die Mischung portionsweise mit dem Schwingbesen ins Mehl.|Lass den glatten Teig 5 Minuten stehen. Verlies die Beeren in der Zwischenzeit, wasche sie und lass sie abtropfen.|Erhitze wenig Öl in einer beschichteten Pfanne bei mittlerer Hitze. Gib kleine Teigportionen in die Pfanne und backe sie etwa 2 Minuten, bis sich Bläschen bilden und die Ränder fest werden.|Wende die Pancakes und backe sie weitere 1–2 Minuten, bis sie goldbraun und innen durchgebacken sind. Wiederhole das mit dem restlichen Teig und serviere die Beeren dazu."],
['Früchte-Bowl','Frühstück',10,4,'1490645935967-10de6ba17061','Vegan','','Banane:1:Stück|Apfel:1:Stück|Beeren:100:g',"Wasche den Apfel und die frischen Beeren und lass sie abtropfen.|Viertle den Apfel, entferne das Kerngehäuse und schneide ihn in mundgerechte Würfel.|Schäle die Banane und schneide sie in etwa 1 cm dicke Scheiben. Halbiere grosse Beeren.|Verteile Apfel und Banane in Schalen, gib die Beeren darüber und serviere die Bowl sofort."],
['Pasta mit Burrata','Mittagessen',25,8,'1473093295043-cdd812d0e601','Vegetarisch','Gluten,Milch','Pasta:120:g|Tomaten:200:g|Burrata:100:g',"Bringe einen grossen Topf Salzwasser zum Kochen. Gib die Pasta hinein und koche sie nach Packungsangabe bissfest, meist 8–12 Minuten.|Wasche in der Zwischenzeit die Tomaten, entferne die Stielansätze und würfle sie. Erhitze etwas Öl in einer Pfanne bei mittlerer Hitze.|Gib die Tomaten in die Pfanne und lass sie unter gelegentlichem Rühren 8–10 Minuten einkochen. Würze mit Salz und Pfeffer.|Schöpfe etwas Pastawasser ab und giesse die Pasta ab. Gib sie zur Sauce und rühre bei Bedarf 1–2 EL Pastawasser pro Portion ein.|Verteile die Pasta auf die Teller. Lass die Burrata abtropfen, teile sie auf und gib sie kurz vor dem Servieren darüber."],
['Zitronenrisotto','Mittagessen',35,8,'1476124369491-e7addf5db371','Vegetarisch','Milch','Risottoreis:100:g|Parmesan:30:g|Zitrone:1:Stück|Bouillon:300:ml',"Erwärme die Bouillon in einem kleinen Topf und halte sie auf niedriger Hitze warm. Wasche die Zitrone, reibe etwas Schale fein ab und presse etwas Saft aus.|Erhitze wenig Öl in einem zweiten Topf. Gib den ungewaschenen Risottoreis hinzu und rühre bei mittlerer Hitze 1–2 Minuten, bis die Körner leicht glasig werden.|Giesse eine Kelle Bouillon an und rühre regelmässig. Gib erst dann die nächste Kelle hinzu, wenn die Flüssigkeit fast aufgenommen ist.|Wiederhole das etwa 18–22 Minuten, bis der Reis cremig ist und noch leicht Biss hat. Verwende bei Bedarf zusätzlich heisses Wasser.|Ziehe den Topf vom Herd. Rühre den geriebenen Parmesan und den Zitronenabrieb ein und gib nach Geschmack Zitronensaft dazu. Serviere sofort."],
['Gemüse-Reispfanne','Mittagessen',25,6,'1512058564366-18510be2db19','Vegan','','Reis:110:g|Peperoni:1:Stück|Zucchetti:160:g',"Spüle den Reis in einem Sieb und setze ihn mit der auf der Packung angegebenen Wassermenge auf. Reduziere nach dem Aufkochen die Hitze und gare ihn zugedeckt nach Packungsangabe.|Entkerne in der Zwischenzeit die Peperoni und schneide sie und die Zucchetti in etwa 1 cm grosse Stücke.|Erhitze etwas Öl in einer grossen Pfanne. Brate zuerst die Peperoni bei mittlerer bis hoher Hitze 3–4 Minuten. Gib die Zucchetti dazu und brate alles weitere 4–5 Minuten.|Lockere den fertigen Reis mit einer Gabel auf, gib ihn zum Gemüse und brate alles unter Wenden 2 Minuten. Würze mit Salz und Pfeffer."],
['Poulet-Fajitas','Mittagessen',30,11,'1551504734-5ee1c4a1479b','Fleisch','Gluten','Pouletbrust:170:g|Tortillas:2:Stück|Peperoni:1:Stück',"Wasche und entkerne die Peperoni und schneide sie in Streifen. Schneide die Pouletbrust auf einem separaten Brett in gleichmässige Streifen. Wasche danach Hände und benutzte Utensilien.|Erhitze wenig Öl in einer grossen Pfanne. Brate das Poulet bei mittlerer bis hoher Hitze unter gelegentlichem Wenden etwa 5–8 Minuten, bis es im dicksten Stück mindestens 74 °C erreicht. Nimm es auf einen sauberen Teller.|Brate die Peperonistreifen in derselben Pfanne 4–5 Minuten. Gib das Poulet wieder dazu und würze nach Geschmack mit Salz, Pfeffer und Paprikapulver.|Wärme die Tortillas kurz nach Packungsangabe auf. Verteile die Füllung darauf, klappe den unteren Rand ein und rolle die Tortillas auf."],
['Tomaten-Gnocchi','Mittagessen',25,7,'1551183053-bf91a1d81141','Vegetarisch','Gluten,Milch','Gnocchi:220:g|Tomaten:170:g|Mozzarella:90:g',"Wasche die Tomaten, entferne den Stielansatz und schneide sie in kleine Würfel. Lass den Mozzarella abtropfen und würfle ihn grob.|Erhitze etwas Öl in einer Pfanne bei mittlerer Hitze und lass die Tomaten unter gelegentlichem Rühren 8–10 Minuten köcheln. Würze mit Salz und Pfeffer.|Bringe in der Zwischenzeit Wasser zum Kochen. Gare die Gnocchi nach Packungsangabe und schöpfe sie mit einer Schaumkelle ab, sobald sie an der Oberfläche schwimmen.|Wende die Gnocchi in der Tomatensauce. Nimm die Pfanne vom Herd, verteile den Mozzarella darüber und lass ihn zugedeckt 1–2 Minuten anschmelzen."],
['Thai-Gemüsecurry','Abendessen',35,9,'1603894584373-5ac82b2ae398','Vegan','','Kokosmilch:200:ml|Reis:110:g|Broccoli:150:g|Karotten:120:g',"Setze den Reis nach Packungsangabe auf. Teile den Broccoli in kleine Röschen, schäle die Karotten und schneide sie in dünne Scheiben.|Erhitze wenig Öl im Topf bei mittlerer Hitze. Dünste die Karotten 3 Minuten und rühre nach Geschmack etwas Currypulver kurz ein.|Giesse die Kokosmilch dazu und lass die Karotten 5 Minuten sanft köcheln. Gib dann den Broccoli hinzu und gare alles weitere 5–7 Minuten, bis das Gemüse bissfest ist.|Schmecke die Sauce ab. Ist sie zu dick, rühre etwas Wasser ein. Lockere den gegarten Reis mit einer Gabel und serviere das Curry darauf."],
['Ofenpoulet','Abendessen',45,12,'1532550907401-a500c9a57435','Fleisch','','Pouletbrust:180:g|Kartoffeln:250:g|Karotten:130:g',"Heize den Backofen auf 200 °C Ober-/Unterhitze vor. Schneide Kartoffeln und Karotten in etwa 2 cm grosse Stücke.|Mische das Gemüse auf einem Blech mit etwas Öl, Salz und Pfeffer. Verteile es in einer Lage und röste es auf der mittleren Schiene 15 Minuten.|Tupfe in der Zwischenzeit die Pouletbrust trocken und würze sie. Wasche Hände und benutzte Utensilien und lege das Poulet nach den ersten 15 Minuten zum Gemüse aufs Blech.|Backe alles je nach Dicke der Brust etwa 18–25 Minuten weiter. Das Gemüse soll weich sein und das Poulet im dicksten Teil mindestens 74 °C erreichen.|Nimm das Blech aus dem Ofen und lass das Poulet vor dem Anschneiden 3 Minuten ruhen."],
['Lachs mit Gemüse','Abendessen',30,14,'1467003909585-2f8a72700288','Fisch','Fisch','Lachs:180:g|Broccoli:170:g|Kartoffeln:230:g',"Schäle die Kartoffeln, schneide sie in etwa 2 cm grosse Stücke und gare sie 12–15 Minuten in Salzwasser, bis sie sich leicht einstechen lassen.|Teile den Broccoli in kleine Röschen und gare ihn separat 4–6 Minuten in wenig Wasser, bis er bissfest ist.|Tupfe in der Zwischenzeit den Lachs trocken und würze ihn. Erhitze etwas Öl in einer Pfanne und brate ihn bei mittlerer Hitze zuerst auf der Hautseite etwa 4–5 Minuten.|Wende den Lachs und gare ihn auf der zweiten Seite weiter, bis er an der dicksten Stelle 63 °C erreicht. Giesse Kartoffeln und Broccoli ab und serviere alles zusammen."],
['Vegetarische Lasagne','Abendessen',50,10,'1574894709920-11b28e7367e3','Vegetarisch','Gluten,Milch','Lasagneblätter:100:g|Tomatensauce:200:g|Zucchetti:140:g|Mozzarella:90:g',"Heize den Ofen auf 190 °C Ober-/Unterhitze vor. Schneide die Zucchetti in dünne Scheiben und lass den gewürfelten Mozzarella abtropfen.|Brate die Zucchetti in wenig Öl bei mittlerer bis hoher Hitze 4–5 Minuten. Prüfe auf der Packung, ob die Lasagneblätter vorgekocht werden müssen.|Gib etwas Tomatensauce in die Auflaufform. Schichte Blätter, Sauce und Zucchetti abwechselnd. Bedecke jedes Blatt mit Sauce und verteile den Mozzarella oben.|Backe die Lasagne auf mittlerer Schiene etwa 30–35 Minuten oder nach Packungsangabe, bis die Blätter weich sind und der Käse goldbraun ist.|Lass die Lasagne vor dem Anschneiden 5 Minuten stehen."],
['Tofu mit Reis','Abendessen',30,8,'1546069901-ba9599a7e63c','Vegan','Soja','Tofu:170:g|Reis:110:g|Broccoli:170:g',"Spüle den Reis ab und gare ihn nach Packungsangabe. Lass den Tofu in der Zwischenzeit abtropfen, tupfe ihn trocken und schneide ihn in etwa 2 cm grosse Würfel.|Teile den Broccoli in Röschen und gare ihn in wenig kochendem Wasser 4–6 Minuten, bis er bissfest ist. Giesse ihn ab.|Erhitze etwas Öl in einer beschichteten Pfanne. Brate den Tofu bei mittlerer bis hoher Hitze 7–9 Minuten und wende die Würfel regelmässig, bis sie rundum goldbraun sind.|Gib den Broccoli zum Tofu und erwärme ihn kurz mit. Würze nach Geschmack und serviere beides auf dem aufgelockerten Reis."],
['Schokoladenmousse','Dessert',20,5,'1511715282680-fbf93a50e721','Vegetarisch','Milch','Schokolade:60:g|Rahm:120:ml',"Hacke die Schokolade fein und schmelze sie in einer hitzefesten Schüssel über einem Topf mit leicht siedendem Wasser. Der Schüsselboden soll das Wasser nicht berühren.|Nimm die Schüssel herunter und lass die Schokolade etwa 5 Minuten abkühlen, bis sie lauwarm und noch flüssig ist.|Schlage den kalten Rahm weich auf. Rühre zuerst einen kleinen Teil davon zügig in die Schokolade, damit sich die Temperaturen angleichen.|Hebe den übrigen Rahm in zwei Portionen mit einem Teigschaber unter. Fülle die Mousse in Gläser und stelle sie mindestens 2 Stunden in den Kühlschrank."],
['Beeren-Crêpes','Dessert',25,5,'1519676867240-f03562e64548','Vegetarisch','Gluten,Milch,Eier','Mehl:80:g|Milch:150:ml|Eier:1:Stück|Beeren:100:g',"Verrühre Mehl und die Hälfte der Milch mit dem Schwingbesen. Rühre das Ei und die restliche Milch ein, bis der Teig glatt und dünnflüssig ist.|Lass den Teig 5 Minuten ruhen. Verlies und wasche in der Zwischenzeit die frischen Beeren und lass sie abtropfen.|Erhitze wenig Öl in einer beschichteten Pfanne bei mittlerer Hitze. Gib eine kleine Kelle Teig hinein und schwenke die Pfanne sofort, bis der Boden dünn bedeckt ist.|Backe die Crêpe 1–2 Minuten, bis sich der Rand löst. Wende sie und backe die zweite Seite 30–60 Sekunden. Wiederhole das mit dem restlichen Teig.|Verteile die Beeren auf den warmen Crêpes und falte sie zusammen."],
['Fruchtsalat','Dessert',10,4,'1490474418585-ba9bad8fd0ea','Vegan','','Apfel:1:Stück|Banane:1:Stück|Beeren:100:g',"Wasche Apfel und frische Beeren. Verlies die Beeren und lass sie abtropfen.|Viertle und entkerne den Apfel und schneide ihn in kleine Würfel. Halbiere grössere Beeren.|Schäle die Banane erst kurz vor dem Servieren und schneide sie in Scheiben.|Hebe alles in einer Schüssel vorsichtig untereinander, damit die Beeren ganz bleiben. Serviere den Fruchtsalat sofort oder stelle ihn kurz kalt."],
['Vanillejoghurt','Dessert',8,4,'1488477181946-6428a0291777','Vegetarisch','Milch','Joghurt:180:g|Beeren:120:g|Vanillezucker:10:g',"Gib den Joghurt mit dem Vanillezucker in eine Schüssel und rühre etwa 30 Sekunden, bis sich der Zucker verteilt hat.|Verlies die frischen Beeren, wasche sie und lass sie gut abtropfen. Schneide grosse Beeren klein.|Verteile den Joghurt auf Gläser. Hebe nach Belieben die Hälfte der Beeren unter und gib den Rest darüber.|Serviere den Joghurt direkt oder stelle ihn zugedeckt bis zum Essen kalt."],
['Linsen mit Reis','Mittagessen',25,2,'','Vegan','','Rote Linsen:80:g|Reis:80:g|Karotten:100:g',"Spüle den Reis und gare ihn zugedeckt nach Packungsangabe. Stelle währenddessen einen zweiten Topf bereit.|Spüle die roten Linsen. Schäle die Karotten und schneide sie in kleine Würfel.|Gib die Karotten und Linsen in den zweiten Topf und bedecke sie gut mit Wasser. Lass sie 12–15 Minuten sanft köcheln und rühre gelegentlich um.|Prüfe, ob die Linsen weich sind. Giesse überschüssiges Wasser ab oder lass den Topf kurz offen einkochen. Würze und serviere die Linsen mit dem Reis."],
['Pasta mit Tomatensauce','Mittagessen',20,2.5,'','Vegan','Gluten','Pasta:120:g|Passierte Tomaten:180:g|Karotten:80:g',"Bringe einen grossen Topf Salzwasser zum Kochen. Koche die Pasta nach Packungsangabe bissfest, meist 8–12 Minuten.|Schäle in der Zwischenzeit die Karotten und raffle sie fein. Erhitze etwas Öl in einer Pfanne bei mittlerer Hitze und dünste die Karotten darin unter Rühren 2–3 Minuten.|Gib die passierten Tomaten zu den Karotten. Lass die Sauce ohne Deckel 8–10 Minuten leicht köcheln und rühre gelegentlich um.|Schmecke die Sauce mit Salz und Pfeffer ab. Giesse die Pasta ab, mische sie direkt unter die Sauce und lockere sie bei Bedarf mit etwas Pastawasser."],
['Kartoffeln mit Kichererbsen','Abendessen',35,2.5,'','Vegan','','Kartoffeln:300:g|Kichererbsen:150:g|Karotten:100:g',"Heize den Ofen auf 200 °C Ober-/Unterhitze vor. Wasche oder schäle die Kartoffeln und Karotten und würfle sie etwa 2 cm gross.|Mische das Gemüse mit wenig Öl, Salz und Pfeffer auf einem Blech. Verteile es in einer Lage und röste es 20 Minuten.|Giesse die vorgegarten Kichererbsen ab, spüle sie im Sieb und lass sie gut abtropfen.|Wende das Gemüse, streue die Kichererbsen darüber und röste alles weitere 10 Minuten, bis die Kartoffeln innen weich und aussen goldbraun sind."],
['Linsen-Kartoffel-Eintopf','Abendessen',30,2,'','Vegan','','Rote Linsen:80:g|Kartoffeln:250:g|Karotten:100:g',"Schäle die Kartoffeln und Karotten. Würfle die Kartoffeln etwa 1,5 cm gross und schneide die Karotten in dünne Scheiben.|Spüle die roten Linsen in einem Sieb. Gib sie mit dem Gemüse in einen Topf und füge Wasser hinzu, bis alles knapp bedeckt ist.|Bringe den Topf zum Kochen. Reduziere die Hitze und lass den Eintopf mit aufgelegtem Deckel 18–22 Minuten köcheln. Rühre gelegentlich um und giesse bei Bedarf Wasser nach.|Sobald die Kartoffeln weich sind, zerdrücke für eine dickere Konsistenz einige Stücke am Topfrand. Würze mit Salz und Pfeffer."],
["Linsen-Pasta mit Tomaten","Mittagessen",25,1.05,"","Vegan","Gluten","Pasta:90:g|Rote Linsen:55:g|Passierte Tomaten:150:g","Spüle die roten Linsen. Gib sie mit den passierten Tomaten und ungefähr 100 ml Wasser pro Portion in einen Topf.|Bringe die Sauce zum Kochen. Lass sie bei mittlerer Hitze 15–20 Minuten sanft köcheln und rühre zwischendurch um. Gib etwas Wasser hinzu, falls sie zu dick wird, bevor die Linsen weich sind.|Bringe in der Zwischenzeit einen zweiten Topf Salzwasser zum Kochen. Koche die Pasta nach Packungsangabe bissfest und schöpfe vor dem Abgiessen etwas Pastawasser ab.|Würze die Linsensauce mit Salz und Pfeffer, mische sie mit den Nudeln und gib bei Bedarf etwas Pastawasser hinzu."],
["Kichererbsen-Couscous","Mittagessen",15,1.15,"","Vegan","Gluten","Couscous:85:g|Kichererbsen:130:g|Karotten:120:g","Gib den Couscous in eine grosse hitzefeste Schüssel. Übergiesse ihn mit der auf der Packung angegebenen Menge kochendem Wasser und decke die Schüssel 5–10 Minuten ab.|Schäle in der Zwischenzeit die Karotten und raffle sie grob. Giesse die vorgegarten Kichererbsen ab, spüle sie und lass sie abtropfen.|Lockere den Couscous mit einer Gabel auf. Gib die Karotten und Kichererbsen dazu und vermenge alles.|Würze mit Salz und Pfeffer und nach Belieben etwas Öl. Serviere den Couscous lauwarm."],
["Kartoffel-Bohnen-Salat","Mittagessen",30,1.1,"","Vegan","","Kartoffeln:280:g|Weisse Bohnen:140:g|Apfelessig:10:ml","Schäle die Kartoffeln und schneide sie in etwa 2 cm grosse Würfel. Gare sie 12–15 Minuten in leicht gesalzenem Wasser, bis sie weich sind, aber nicht zerfallen.|Giesse in der Zwischenzeit die vorgegarten weissen Bohnen ab und spüle sie im Sieb.|Verrühre den Apfelessig mit etwas Öl, Salz und Pfeffer in einer Schüssel.|Giesse die Kartoffeln ab, mische sie noch warm mit dem Dressing und hebe die Bohnen vorsichtig unter. Lass den Salat vor dem Essen 5 Minuten ziehen."],
["Reis mit Erbsen und Mais","Mittagessen",25,1.2,"","Vegan","","Reis:95:g|Erbsen:120:g|Mais:80:g","Spüle den Reis in einem Sieb und gare ihn mit der auf der Packung angegebenen Wassermenge.|Giesse in der Zwischenzeit den Mais ab. Gib die Erbsen mit einem kleinen Schluck Wasser in eine Pfanne, koche das Wasser auf und gare sie nach Packungsangabe.|Gib den Mais zu den gegarten Erbsen und rühre 2 Minuten bei mittlerer Hitze, bis er warm ist.|Lockere den gegarten Reis mit einer Gabel auf und mische ihn mit dem Gemüse. Würze mit Salz und Pfeffer."],
["Polenta mit weissen Bohnen","Mittagessen",25,1.2,"","Vegan","","Polenta:90:g|Weisse Bohnen:130:g|Passierte Tomaten:140:g","Bringe für die Polenta die Wassermenge gemäss Packungsangabe zum Kochen. Lass den Maisgriess unter Rühren einrieseln.|Reduziere die Hitze und gare die Polenta nach Packungsangabe. Rühre regelmässig um, damit sie nicht am Boden ansetzt.|Giesse in der Zwischenzeit die vorgegarten weissen Bohnen ab und spüle sie. Lass die passierten Tomaten in einem kleinen Topf 5 Minuten köcheln.|Gib die Bohnen in die Tomatensauce, erhitze sie weitere 4–5 Minuten und schmecke ab. Löffle die Sauce auf die cremige Polenta."],
["Kichererbsen-Reis mit Spinat","Mittagessen",25,1.25,"","Vegan","","Reis:90:g|Kichererbsen:120:g|Tiefkühlspinat:100:g","Spüle den Reis und gare ihn nach Packungsangabe. Lasse ihn anschliessend kurz zugedeckt stehen.|Gib in der Zwischenzeit den Tiefkühlspinat mit wenig Wasser in einen Topf. Bringe ihn zum Kochen und gare ihn nach Packungsangabe unter gelegentlichem Rühren.|Giesse die vorgegarten Kichererbsen ab und spüle sie. Rühre sie unter den gegarten Spinat und erhitze alles 3–4 Minuten.|Schmecke die Spinatmischung mit Salz und Pfeffer ab. Lockere den Reis mit einer Gabel auf und gib die Mischung darüber."],
["Warmer Linsensalat mit Randen","Mittagessen",30,1.15,"","Vegan","","Braune Linsen:85:g|Randen:150:g|Kartoffeln:170:g","Spüle die braunen Linsen und gare sie in einem Topf nach Packungsangabe, je nach Sorte etwa 20–30 Minuten, bis sie weich sind.|Schäle in der Zwischenzeit die Kartoffeln, würfle sie und koche sie separat in leicht gesalzenem Wasser etwa 12–15 Minuten.|Würfle die vorgegarten Randen ebenfalls. Gib sie mit etwas Öl, Salz und Pfeffer in eine Schüssel.|Giesse die Linsen und Kartoffeln ab, mische beides noch warm mit den Randen und lass den Salat kurz ziehen."],
["Erbsen-Pasta","Mittagessen",20,1.1,"","Vegan","Gluten","Pasta:100:g|Erbsen:150:g|Zitrone:0.25:Stück","Bringe Salzwasser zum Kochen und gare die Pasta nach Packungsangabe.|Gare die Erbsen in der Zwischenzeit separat nach Packungsangabe. Presse etwas Zitronensaft aus.|Schöpfe eine kleine Tasse Pastawasser ab. Zerdrücke etwa die Hälfte der gegarten Erbsen mit einer Gabel und rühre so viel Pastawasser ein, dass eine cremige Sauce entsteht.|Giesse die Pasta ab. Mische sie mit der Erbsensauce, den restlichen Erbsen und etwas Zitronensaft. Schmecke mit Salz und Pfeffer ab."],
["Linsen-Gerstensalat","Mittagessen",35,1.25,"","Vegan","Gluten","Rollgerste:85:g|Braune Linsen:65:g|Rotkabis:130:g","Spüle Gerste und Linsen in einem Sieb. Gare sie in zwei Töpfen nach Packungsangabe und beginne mit der Zutat, die länger braucht.|Entferne in der Zwischenzeit den Strunk des Rotkabis und schneide ihn in feine Streifen.|Erhitze etwas Öl in einer Pfanne und dünste den Kabis mit einem Schuss Wasser 6–8 Minuten zugedeckt. Rühre gelegentlich um.|Giesse Gerste und Linsen ab und mische sie warm mit dem Kabis. Würze mit Salz und Pfeffer und serviere sofort."],
["Tomatenreis mit Kidneybohnen","Mittagessen",25,1.3,"","Vegan","","Reis:85:g|Kidneybohnen:140:g|Passierte Tomaten:150:g","Spüle den Reis und gare ihn zugedeckt nach Packungsangabe.|Giesse in der Zwischenzeit die vorgegarten Kidneybohnen ab, spüle sie in einem Sieb und lasse sie abtropfen.|Erhitze die passierten Tomaten in einem kleinen Topf. Gib die Bohnen dazu und lass alles bei mittlerer Hitze 8–10 Minuten köcheln. Rühre gelegentlich um.|Schmecke die Bohnensauce mit Salz und Pfeffer ab. Lockere den Reis auf und gib die Sauce darüber."],
["Kartoffel-Erbsen-Stampf","Abendessen",30,1.1,"","Vegan","Gluten","Kartoffeln:320:g|Erbsen:150:g|Haferdrink:60:ml","Schäle die Kartoffeln und schneide sie in etwa 2 cm grosse Würfel. Koche sie in Salzwasser 15–18 Minuten, bis sie sehr weich sind.|Gare in der Zwischenzeit die Erbsen in einem zweiten Topf nach Packungsangabe und giesse sie ab.|Erwärme den Haferdrink. Giesse die Kartoffeln ab und lasse sie im warmen Topf 1 Minute ausdampfen.|Zerdrücke die Kartoffeln mit einem Stampfer und gib den Haferdrink nach und nach dazu. Hebe die Erbsen unter und schmecke mit Salz und Pfeffer ab."],
["Roter Linseneintopf mit Reis","Abendessen",30,1.05,"","Vegan","","Rote Linsen:85:g|Reis:75:g|Passierte Tomaten:150:g","Spüle den Reis in einem Sieb und gare ihn mit der auf der Packung angegebenen Wassermenge.|Spüle die roten Linsen separat. Gib sie mit den passierten Tomaten und etwa 150 ml Wasser pro Portion in einen zweiten Topf.|Koche die Linsen auf und lasse sie bei mittlerer Hitze ungefähr 15–20 Minuten köcheln. Rühre regelmässig und giesse etwas Wasser nach, falls die Linsen am Topfboden ansetzen.|Würze den Eintopf, sobald die Linsen weich sind. Lockere den Reis mit einer Gabel auf und schöpfe den Eintopf darauf."],
["Ofenkartoffeln mit cremigen Bohnen","Abendessen",35,1.2,"","Vegan","","Kartoffeln:300:g|Weisse Bohnen:150:g|Zitrone:0.25:Stück","Heize den Ofen auf 220 °C Ober-/Unterhitze vor. Wasche die Kartoffeln und schneide sie in dünne Spalten.|Mische die Spalten mit etwas Öl und Salz. Verteile sie in einer Lage auf dem Blech und röste sie 25–30 Minuten. Wende sie nach der Hälfte der Zeit.|Spüle in der Zwischenzeit die vorgegarten Bohnen und presse etwas Zitronensaft aus.|Zerdrücke die Bohnen mit Zitronensaft und löffelweise Wasser zu einer Creme. Würze die Creme und serviere sie zu den goldbraunen Kartoffelspalten."],
["Kichererbsen mit Rotkabis und Bulgur","Abendessen",25,1.2,"","Vegan","Gluten","Bulgur:85:g|Kichererbsen:130:g|Rotkabis:140:g","Spüle den Bulgur und gare ihn nach Packungsangabe. Lass ihn anschliessend kurz zugedeckt quellen.|Schneide in der Zwischenzeit den Rotkabis ohne Strunk in feine Streifen. Dünste ihn mit wenig Öl und einem Schuss Wasser 6–8 Minuten zugedeckt.|Giesse die vorgegarten Kichererbsen ab und spüle sie. Gib sie zum Kabis und erhitze sie unter Rühren weitere 3 Minuten.|Lockere den Bulgur mit einer Gabel auf, mische ihn mit Kabis und Kichererbsen und schmecke mit Salz und Pfeffer ab."],
["Spinat-Polenta mit Kichererbsen","Abendessen",25,1.3,"","Vegan","","Polenta:90:g|Tiefkühlspinat:130:g|Kichererbsen:130:g","Koche für die Polenta die Wassermenge nach Packungsangabe auf. Gib den Maisgriess unter Rühren dazu und gare ihn auf niedriger Hitze nach Packungsangabe.|Gib in der Zwischenzeit den Tiefkühlspinat mit einem Schuss Wasser in einen zweiten Topf und gare ihn nach Packungsangabe.|Spüle die vorgegarten Kichererbsen ab und rühre sie in den gegarten Spinat. Erhitze beides 3–4 Minuten und schmecke es ab.|Rühre die Polenta noch einmal durch und verteile sie auf die Teller. Gib die Spinat-Kichererbsen-Mischung darauf."],
["Kabis-Nudelpfanne mit Linsen","Abendessen",30,1.25,"","Vegan","Gluten","Pasta:90:g|Weisskabis:170:g|Braune Linsen:60:g","Spüle die braunen Linsen und gare sie nach Packungsangabe. Bringe für die Pasta separat Salzwasser zum Kochen.|Schneide den Weisskabis ohne Strunk in feine Streifen. Dünste ihn in etwas Öl bei mittlerer Hitze und mit einem Schuss Wasser etwa 8–10 Minuten, bis er weich ist.|Koche währenddessen die Pasta nach Packungsangabe bissfest. Bewahre etwas Kochwasser auf und giesse Pasta und Linsen ab.|Gib Pasta und Linsen zum Kabis. Rühre nach Bedarf etwas Kochwasser ein, erhitze alles 2 Minuten und würze mit Salz und Pfeffer."],
["Kartoffel-Mais-Pfanne mit Kidneybohnen","Abendessen",30,1.25,"","Vegan","","Kartoffeln:290:g|Mais:100:g|Kidneybohnen:120:g","Schäle die Kartoffeln und würfle sie etwa 1 cm gross. Erhitze etwas Öl in einer grossen Pfanne bei mittlerer Hitze.|Brate die Kartoffeln 5 Minuten unter gelegentlichem Wenden. Gib einen Schuss Wasser hinzu und gare sie zugedeckt weitere 8–10 Minuten, bis sie innen weich sind.|Giesse in der Zwischenzeit den Mais und die vorgegarten Kidneybohnen ab und spüle die Bohnen. Nimm den Deckel ab und lasse Restwasser verdampfen.|Gib Mais und Bohnen dazu. Brate alles unter Wenden 3–4 Minuten und schmecke mit Salz und Pfeffer ab."],
["Kürbis-Linsen-Suppe mit Polenta","Abendessen",35,1.25,"","Vegan","","Kürbis:220:g|Rote Linsen:75:g|Polenta:75:g","Entkerne den Kürbis und schäle ihn, falls die Sorte eine harte Schale hat. Schneide das Fruchtfleisch in etwa 2 cm grosse Würfel und spüle die roten Linsen.|Gib Kürbis und Linsen in einen Topf und bedecke sie gut mit Wasser. Lass sie nach dem Aufkochen 18–22 Minuten köcheln, bis beides weich ist.|Koche in einem zweiten Topf die Polenta nach Packungsangabe. Rühre sie regelmässig um, während die Suppe gart.|Nimm die Suppe vom Herd und püriere sie. Verdünne sie bei Bedarf mit heissem Wasser, schmecke ab und serviere die Polenta dazu."],
["Bohnenragout mit Gerste","Abendessen",35,1.35,"","Vegan","Gluten","Rollgerste:85:g|Weisse Bohnen:130:g|Tiefkühlspinat:100:g","Spüle die Rollgerste und gare sie nach Packungsangabe. Giesse überschüssiges Wasser am Ende ab.|Gib in der Zwischenzeit den Tiefkühlspinat mit wenig Wasser in einen zweiten Topf und gare ihn nach Packungsangabe.|Giesse die vorgegarten weissen Bohnen ab, spüle sie und rühre sie unter den gegarten Spinat. Lass das Ragout 4–5 Minuten sanft köcheln.|Zerdrücke einige Bohnen am Topfrand, damit das Ragout cremiger wird. Würze es und serviere es auf der Gerste."],
["Linsen-Kartoffel-Puffer","Abendessen",35,1.2,"","Vegan","","Kartoffeln:260:g|Rote Linsen:75:g|Maisstärke:15:g","Spüle die roten Linsen und gare sie nach Packungsangabe weich. Giesse sie in einem feinen Sieb ab und lasse sie gut ausdampfen.|Schäle in der Zwischenzeit die Kartoffeln, raffle sie fein und drücke überschüssige Flüssigkeit in einem sauberen Küchentuch aus.|Zerdrücke die Linsen etwas und mische sie mit den Kartoffeln, der Maisstärke und einer Prise Salz. Forme flache, etwa 1 cm dicke Puffer.|Erhitze wenig Öl in einer beschichteten Pfanne bei mittlerer Hitze. Brate die Puffer portionsweise je Seite 4–6 Minuten, bis sie goldbraun und die Kartoffeln innen weich sind."],
["Bananen-Porridge","Frühstück",10,0.45,"","Vegan","Gluten","Haferflocken:65:g|Banane:1:Stück","Gib die Haferflocken mit etwa 200 ml Wasser pro Portion und einer Prise Salz in einen kleinen Topf.|Bringe alles bei mittlerer Hitze unter Rühren zum Köcheln. Reduziere die Hitze und gare die Flocken 5–7 Minuten, bis sie weich und cremig sind.|Schäle in der Zwischenzeit die Banane. Zerdrücke eine Hälfte mit der Gabel und schneide die andere in Scheiben.|Rühre die zerdrückte Banane unter den Brei und verteile die Scheiben darauf. Bei Bedarf mit etwas Wasser cremiger rühren."],
["Apfel-Zimt-Porridge","Frühstück",12,0.45,"","Vegan","Gluten","Haferflocken:65:g|Apfel:1:Stück|Zimt:1:g","Wasche den Apfel, entferne das Kerngehäuse und raffle den Apfel grob.|Gib die Haferflocken, den Apfel und etwa 200 ml Wasser pro Portion in einen Topf. Bringe die Mischung bei mittlerer Hitze zum Köcheln.|Reduziere die Hitze und gare den Brei 6–8 Minuten unter gelegentlichem Rühren. Gib etwas Wasser hinzu, wenn er zu dick wird.|Rühre den Zimt unter und verteile den warmen Brei auf Schalen."],
["Warmer Bananen-Maisbrei","Frühstück",15,0.55,"","Vegan","","Polenta:75:g|Banane:1:Stück","Bringe für die Polenta die auf der Packung angegebene Wassermenge zum Kochen.|Lass den Maisgriess unter stetigem Rühren einrieseln, damit keine Klumpen entstehen. Reduziere die Hitze und gare ihn nach Packungsangabe.|Schäle in der Zwischenzeit die Banane und schneide sie in dünne Scheiben.|Rühre die Polenta noch einmal cremig. Verteile sie auf Schalen und lege die Bananenscheiben darauf."],
["Birnen-Hirsebrei","Frühstück",20,0.6,"","Vegan","","Hirse:70:g|Birne:1:Stück","Spüle die Hirse gründlich in einem feinen Sieb. Setze sie mit der auf der Packung angegebenen Wassermenge auf.|Koche die Hirse auf und lasse sie zugedeckt bei niedriger Hitze nach Packungsangabe garen, meist 15–20 Minuten.|Wasche in der Zwischenzeit die Birne, entferne das Kerngehäuse und würfle sie etwa 1 cm gross.|Rühre die Birnenwürfel in den letzten 3–4 Minuten unter die Hirse. Gib bei Bedarf etwas Wasser dazu und serviere den Brei warm."],
["Kabis-Apfel-Salat","Vorspeise",10,0.45,"","Vegan","","Weisskabis:130:g|Apfel:0.5:Stück|Apfelessig:10:ml","Entferne welke Blätter und den harten Strunk des Weisskabis. Schneide oder hoble die Blätter in feine Streifen.|Gib den Kabis mit einer Prise Salz in eine Schüssel und knete ihn 1–2 Minuten, bis er etwas weicher wird.|Wasche und entkerne den Apfel, raffle ihn grob und gib ihn sofort zum Kabis.|Verrühre Apfelessig und nach Belieben etwas Öl mit dem Salat. Lass ihn 5 Minuten ziehen und schmecke nochmals ab."],
["Kartoffel-Lauch-Suppe","Vorspeise",25,0.45,"","Vegan","","Kartoffeln:150:g|Lauch:70:g","Schäle die Kartoffeln und schneide sie in kleine Würfel. Halbiere den Lauch längs, wasche ihn gründlich zwischen den Schichten und schneide ihn in Streifen.|Dünste den Lauch in einem Topf mit etwas Öl bei mittlerer Hitze 2–3 Minuten unter Rühren.|Gib die Kartoffeln dazu und giesse Wasser an, bis das Gemüse knapp bedeckt ist. Lass die Suppe 15–18 Minuten zugedeckt köcheln, bis die Kartoffeln weich sind.|Nimm den Topf vom Herd, püriere die Suppe und schmecke sie mit Salz und Pfeffer ab."],
["Randen-Apfel-Salat","Vorspeise",10,0.55,"","Vegan","","Randen:140:g|Apfel:0.5:Stück|Apfelessig:10:ml","Lass die vorgegarten Randen abtropfen und schneide sie in etwa 1 cm grosse Würfel.|Wasche den Apfel, entferne das Kerngehäuse und würfle ihn ebenfalls.|Verrühre Apfelessig mit etwas Öl, Salz und Pfeffer in einer Schüssel.|Hebe Randen und Apfel vorsichtig unter das Dressing, lass den Salat 5 Minuten ziehen und serviere ihn bei Zimmertemperatur."],
["Kürbissuppe","Vorspeise",25,0.5,"","Vegan","","Kürbis:190:g|Kartoffeln:70:g","Entkerne den Kürbis und schäle ihn bei harter Schale. Schäle auch die Kartoffeln und schneide beides in etwa 1,5 cm grosse Würfel.|Dünste die Würfel im Topf mit ein wenig Öl 2 Minuten bei mittlerer Hitze an. Rühre dabei regelmässig um.|Giesse so viel Wasser an, dass das Gemüse knapp bedeckt ist. Bringe es zum Kochen und lass es 15–18 Minuten zugedeckt weich garen.|Nimm den Topf vom Herd und püriere die Suppe. Würze sie und gib bei Bedarf noch einen Schluck heisses Wasser dazu."],
["Apfelkompott","Dessert",15,0.4,"","Vegan","","Apfel:1:Stück|Zimt:1:g","Wasche den Apfel, entferne das Kerngehäuse und schneide ihn in etwa 1–2 cm grosse Würfel.|Gib die Apfelwürfel mit 2–3 EL Wasser pro Portion in einen kleinen Topf. Bringe das Wasser zum Köcheln.|Gare den Apfel 8–10 Minuten zugedeckt bei niedriger Hitze und rühre zwischendurch um. Gib einen Schluck Wasser nach, wenn der Topfboden trocken wird.|Sobald sich die Stücke leicht zerdrücken lassen, nimm den Topf vom Herd und rühre den Zimt unter."],
["Warme Zimtbanane","Dessert",10,0.45,"","Vegan","","Banane:1:Stück|Zimt:1:g","Schäle die Banane und halbiere sie der Länge nach. Erhitze eine beschichtete Pfanne bei mittlerer Hitze.|Lege die Hälften mit der Schnittfläche nach unten in die Pfanne und brate sie 2–3 Minuten, bis die Schnittfläche leicht bräunt.|Wende die Banane vorsichtig mit einem Pfannenwender und erwärme die zweite Seite weitere 1–2 Minuten.|Nimm die Hälften aus der Pfanne, streue den Zimt darüber und serviere sie warm."],
["Birnenkompott","Dessert",15,0.5,"","Vegan","","Birne:1:Stück|Zitrone:0.25:Stück","Wasche die Birne, entferne das Kerngehäuse und schneide die Frucht in etwa 1,5 cm grosse Würfel.|Gib die Würfel mit 2–3 EL Wasser pro Portion in einen kleinen Topf und bringe es zum Köcheln.|Gare die Birne zugedeckt bei niedriger Hitze 8–12 Minuten, bis sie weich ist. Rühre gelegentlich um und giesse bei Bedarf etwas Wasser nach.|Ziehe den Topf vom Herd und gib einen Spritzer frisch gepressten Zitronensaft dazu. Serviere das Kompott warm oder abgekühlt."],
["Apfel-Hafer-Crumble","Dessert",25,0.55,"","Vegan","Gluten","Apfel:1:Stück|Haferflocken:25:g|Rapsöl:8:ml","Heize den Backofen auf 190 °C Ober-/Unterhitze vor. Wasche den Apfel, entferne das Kerngehäuse und würfle ihn etwa 1 cm gross.|Gib die Apfelwürfel in eine kleine ofenfeste Form und beträufle sie mit einem Esslöffel Wasser pro Portion.|Mische die Haferflocken mit dem Rapsöl, bis sie leicht zusammenhaften. Verteile die Flocken locker auf dem Apfel.|Backe den Crumble 18–22 Minuten auf der mittleren Schiene, bis die Haferflocken goldbraun und die Apfelwürfel weich sind. Lass ihn kurz abkühlen."]
];

function recipeCents(recipe){
return Math.round(recipe.cost*100)*data.people;
}
function affordablePlan(){
const budget=Math.round(data.budget*100);
const previous=new Set(Object.values(data.plan));
const preferred=new Set(data.liked);
const pools=new Map(activeMeals().map(meal=>[
meal,R.filter(r=>r.meal===meal&&safe(r)).sort((a,b)=>a.cost-b.cost)
]));
const entries=slots();
const remaining=new Map(activeMeals().map(meal=>[meal,data.days.length]));
const plan={};
const used=new Map();
let spent=0;
let weekSeed=0;
for(const char of data.pendingWeek||data.weekStart||iso(monday())){
weekSeed=(Math.imul(31,weekSeed)+char.charCodeAt(0))>>>0;
}
// Reserve enough for every remaining meal before spending on a more expensive recipe.
function reserve(distinct,chosen){
let cents=0;
for(const [meal,count] of remaining){
if(!count)continue;
const pool=pools.get(meal);
if(!distinct){
if(!pool.length)return Infinity;
cents+=recipeCents(pool[0])*count;
continue;
}
const available=pool.filter(r=>!used.has(r.id)&&r.id!==chosen?.id);
if(available.length<count)return Infinity;
cents+=available.slice(0,count).reduce((sum,r)=>sum+recipeCents(r),0);
}
return cents;
}
const distinct=reserve(true)<=budget;
const full=reserve(false)<=budget;
const ordered=full?entries:[...entries].sort((a,b)=>{
const priority=meal=>['Mittagessen','Abendessen'].includes(meal)?0:1;
return priority(a.meal)-priority(b.meal);
});
function variation(id){
let value=(weekSeed^Math.imul(id,0x9e3779b9))>>>0;
value=Math.imul(value^(value>>>16),0x45d9f3b);
return (value^(value>>>16))>>>0;
}
for(const {key,meal} of ordered){
remaining.set(meal,remaining.get(meal)-1);
const candidates=pools.get(meal).filter(recipe=>
(!distinct||!used.has(recipe.id))&&
spent+recipeCents(recipe)+(full?reserve(distinct,recipe):0)<=budget
);
candidates.sort((a,b)=>
(full?0:a.cost-b.cost)||
(used.get(a.id)||0)-(used.get(b.id)||0)||
Number(preferred.has(b.id))-Number(preferred.has(a.id))||
Number(previous.has(a.id))-Number(previous.has(b.id))||
variation(a.id)-variation(b.id)
);
const recipe=candidates[0];
if(!recipe)continue;
plan[key]=recipe.id;
spent+=recipeCents(recipe);
used.set(recipe.id,(used.get(recipe.id)||0)+1);
}
return {plan,spent,missing:entries.length-Object.keys(plan).length};
}

async function passwordVerifier(password,salt){
const encoder=new TextEncoder();
const key=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
const bytes=await crypto.subtle.deriveBits({
name:'PBKDF2',salt:new Uint8Array(salt),iterations:600000,hash:'SHA-256'
},key,256);
return Array.from(new Uint8Array(bytes)).join('.');
}

error.textContent='Das Profil konnte nicht geöffnet oder gespeichert werden. Prüfe, ob du Mealio über HTTPS mit aktiviertem Webspeicher geöffnet hast.';
}finally{
submit.disabled=false;
}
}

<div class="grid">
<div class="card">

${button('Öffnen','go:plan','full')}

</div>

</div>

<small>Geschätzte Kosten</small>

</div>
${total()>data.budget?`<p class="note">Dieser bestehende Plan überschreitet das Budget um ${money(total()-data.budget)}.</p>${button('Diese Woche neu planen','reviseWeek','alt full')}`:''}

<h1>📅 Dein Wochenplan</h1>

</div>`;

return `<div class="card">
<div class="eyebrow">Dein Wochenplan</div>
<h1>📅 ${weekLabel(data.weekStart)}</h1>
<p>${esc(data.store)} · ${data.people} Personen</p>
<div class="grid">
<div class="stat">
<small>Budget</small>
<h3>${money(data.budget)}</h3>
</div>
<div class="stat">
<small>Geschätzte Kosten</small>
<h3>${money(total())}</h3>
</div>
</div>
${total()>data.budget?`<p class="note">Dieser bestehende Plan überschreitet das Budget um ${money(total()-data.budget)}.</p>${button('Diese Woche neu planen','reviseWeek','alt full')}`:''}

function copyShop(){
const text='Mealio Einkaufsliste\n'+data.store+'\n\n'+
items().map(([k,i])=>i.name+': '+i.qty+' '+i.unit).join('\n');
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(text)
.then(()=>alert('Einkaufsliste kopiert!'))
.catch(()=>prompt('Liste kopieren:',text));
}else{
prompt('Liste kopieren:',text);
}
}

<div class="eyebrow">Persönliche Einstellungen</div>

${account?`<p class="muted">Profil · ${esc(profile)} · Kinder: ${account.children}</p>`:''}

<label class="field">Vorname</label>

${options('diet',DIETS)}

${chips('allergies',ALLERGIES)}

${button('✓ Speichern',data.setup?'go:home':'go:intro','full')}
<p>${button(account?'Abmelden':'Zum Profilmenü','signOut','ghost full')}</p>
</div>`;
}
function enableSwipe(){
const el=$('swipeCard');
if(!el)return;
let startX=0,startY=0;
el.addEventListener('touchstart',e=>{
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
},{passive:true});
el.addEventListener('touchend',e=>{
const dx=e.changedTouches[0].clientX-startX;
const dy=e.changedTouches[0].clientY-startY;
if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3){
rate(dx>0);
}
},{passive:true});
}
function runAction(action){
if(action==='guest'){
profile='guest';
account=null;
const previousGuest=readLocal(KEY+':guest');
if(previousGuest||readLocal('mealio-v4')){openProfile('guest');return;}
writeLocal(SESSION,'guest');
return startIntro();
}
if(action==='signOut'){
leaveWeek();
if(writeLocal(SESSION,''))location.reload();
return;
}
if(action==='startIntro')return startIntro();
if(action==='startWeek')return startWeek();
if(action==='reviseWeek'){
startWeek();
data.pendingWeek=data.weekStart;
return;
}
if(action==='backWizard')return backWizard();
if(action==='advanceWizard')return advanceWizard();
if(action==='newRecipes')return newRecipes();
if(action==='budgetRecipes'){data.liked=[];return go('arrange');}
if(action==='editWeek'){
step=3;
return go('wizard');
}
if(action==='sameRecipes')return sameRecipes();
if(action==='rateYes')return rate(true);
if(action==='rateNo')return rate(false);
if(action==='backSwipe')return backSwipe();
if(action==='finishAuto')return finishPlan('auto');
if(action==='finishManual')return finishPlan('manual');
if(action==='copyShop')return copyShop();
if(action==='print')return window.print();
if(action==='peopleMinus')return setValue('people',Math.max(1,data.people-1));
if(action==='peoplePlus')return setValue('people',Math.min(20,data.people+1));
if(action.startsWith('go:'))return go(action.slice(3));
if(action.startsWith('assign:')){
assignReturn=view;
assignKey=action.slice(7);
return go('assign');
}
if(action.startsWith('choose:')){
if(!assignKey)return go('plan');
const recipe=R.find(r=>r.id===Number(action.slice(7))&&safe(r)&&r.meal===assignKey.split('|')[1]);
const current=R.find(r=>r.id===data.plan[assignKey]);
if(!recipe||Math.round(total()*100)+recipeCents(recipe)-(current?recipeCents(current):0)>Math.round(data.budget*100))return;
data.plan[assignKey]=recipe.id;
save();
return go(assignReturn);
}
if(action.startsWith('details:')){
return showDetails(Number(action.slice(8)),view);
}
}
function render(){
const pages={intro,login:profileForm,register:profileForm,wizard,swipe,arrange,manual,assign,details,home,plan,shop,settings};
const app=$('app');
$('topSettings').hidden=!profile||!data.setup;
try{
app.innerHTML=(pages[view]||intro)();
$('nav').classList.toggle('hidden',
!data.setup||['intro','login','register','wizard','swipe','arrange','manual','assign','details'].includes(view));
document.querySelectorAll('[data-nav]').forEach(b=>{
b.classList.toggle('active',b.dataset.nav===view);
});
window.scrollTo(0,0);
if(view==='swipe')enableSwipe();
}catch(error){
app.innerHTML='<div class="card error"><h2>Mealio konnte diese Seite nicht laden</h2><p>'+
esc(error.message)+'</p></div>';
console.error(error);
}
}
document.addEventListener('submit',event=>{
if(event.target.id!=='profileForm')return;
event.preventDefault();
submitProfile(event.target);
});
document.addEventListener('click',event=>{
const nav=event.target.closest('[data-nav]');
if(nav){leaveWeek();go(nav.dataset.nav);return;}
const toggleButton=event.target.closest('[data-toggle]');
if(toggleButton){
toggle(toggleButton.dataset.toggle,toggleButton.dataset.value);
return;
}
const setButton=event.target.closest('[data-set]');
if(setButton){
setValue(setButton.dataset.set,setButton.dataset.value);
return;
}
const actionButton=event.target.closest('[data-action]');
if(actionButton){
runAction(actionButton.dataset.action);
}
});
document.addEventListener('input',event=>{
const key=event.target.dataset.input;
if(!key)return;
if(key==='budget'){
data.budget=Number(event.target.value);
save();
$('budgetValue').textContent=money(data.budget);
return;
}
data[key]=event.target.value;
save();
});
document.addEventListener('change',event=>{
if(event.target.dataset.check){
data.checks[event.target.dataset.check]=event.target.checked;
save();
render();
}
if(event.target.dataset.input==='occasionDay'){
data.occasionDay=event.target.value;
save();
}
});
$('topSettings').addEventListener('click',()=>{leaveWeek();go('settings');});
window.addEventListener('error',event=>{
console.error('Mealio Fehler:',event.message);
});
render();
</script>
