['Bruschetta','Vorspeise',15,3,'1572695157366-5e585ab2b69f','Vegan','Gluten','Tomaten:150:g|Brot:80:g|Basilikum:8:g','Brot rösten|Tomaten schneiden|Mit Basilikum anrichten'],
['Caprese mit Burrata','Vorspeise',10,5,'1608897013039-887f21d8c804','Vegetarisch','Milch','Tomaten:180:g|Burrata:100:g|Basilikum:8:g','Tomaten schneiden|Burrata darauflegen|Mit Basilikum servieren'],
['Karottensuppe','Vorspeise',25,3,'1547592180-85f173990554','Vegan','','Karotten:220:g|Kartoffeln:100:g|Bouillon:250:ml','Gemüse schneiden|In Bouillon weich kochen|Pürieren'],
['Bircher-Müesli','Frühstück',10,4,'1517673400267-0251440c45dc','Vegetarisch','Milch,Gluten','Haferflocken:65:g|Joghurt:150:g|Apfel:1:Stück','Apfel raffeln|Alles vermischen|Kalt servieren'],
['Beeren-Pancakes','Frühstück',20,5,'1528207776546-365bb710ee93','Vegetarisch','Milch,Gluten,Eier','Mehl:90:g|Milch:120:ml|Eier:1:Stück|Beeren:100:g','Teig mischen|Pancakes ausbacken|Mit Beeren servieren'],
['Früchte-Bowl','Frühstück',10,4,'1490645935967-10de6ba17061','Vegan','','Banane:1:Stück|Apfel:1:Stück|Beeren:100:g','Früchte waschen|Schneiden|Anrichten'],
['Pasta mit Burrata','Mittagessen',25,8,'1473093295043-cdd812d0e601','Vegetarisch','Gluten,Milch','Pasta:120:g|Tomaten:200:g|Burrata:100:g','Pasta kochen|Tomaten garen|Mit Burrata servieren'],
['Zitronenrisotto','Mittagessen',35,8,'1476124369491-e7addf5db371','Vegetarisch','Milch','Risottoreis:100:g|Parmesan:30:g|Zitrone:1:Stück|Bouillon:300:ml','Reis mit Bouillon garen|Zitrone zugeben|Parmesan unterrühren'],
['Gemüse-Reispfanne','Mittagessen',25,6,'1512058564366-18510be2db19','Vegan','','Reis:110:g|Peperoni:1:Stück|Zucchetti:160:g','Reis kochen|Gemüse braten|Vermischen'],
['Poulet-Fajitas','Mittagessen',30,11,'1551504734-5ee1c4a1479b','Fleisch','Gluten','Pouletbrust:170:g|Tortillas:2:Stück|Peperoni:1:Stück','Poulet vollständig garen|Gemüse braten|Tortillas füllen'],
['Tomaten-Gnocchi','Mittagessen',25,7,'1551183053-bf91a1d81141','Vegetarisch','Gluten,Milch','Gnocchi:220:g|Tomaten:170:g|Mozzarella:90:g','Gnocchi kochen|Tomaten erwärmen|Mozzarella zugeben'],
['Thai-Gemüsecurry','Abendessen',35,9,'1603894584373-5ac82b2ae398','Vegan','','Kokosmilch:200:ml|Reis:110:g|Broccoli:150:g|Karotten:120:g','Reis kochen|Gemüse mit Kokosmilch garen|Servieren'],
['Ofenpoulet','Abendessen',45,12,'1532550907401-a500c9a57435','Fleisch','','Pouletbrust:180:g|Kartoffeln:250:g|Karotten:130:g','Ofen auf 200 Grad vorheizen|Gemüse garen|Poulet vollständig durchgaren'],
['Lachs mit Gemüse','Abendessen',30,14,'1467003909585-2f8a72700288','Fisch','Fisch','Lachs:180:g|Broccoli:170:g|Kartoffeln:230:g','Kartoffeln kochen|Broccoli garen|Lachs vollständig garen'],
['Vegetarische Lasagne','Abendessen',50,10,'1574894709920-11b28e7367e3','Vegetarisch','Gluten,Milch','Lasagneblätter:100:g|Tomatensauce:200:g|Zucchetti:140:g|Mozzarella:90:g','Gemüse schneiden|Zutaten schichten|Im Ofen durchbacken'],
['Tofu mit Reis','Abendessen',30,8,'1546069901-ba9599a7e63c','Vegan','Soja','Tofu:170:g|Reis:110:g|Broccoli:170:g','Reis kochen|Broccoli garen|Tofu anbraten'],
['Schokoladenmousse','Dessert',20,5,'1511715282680-fbf93a50e721','Vegetarisch','Milch','Schokolade:60:g|Rahm:120:ml','Schokolade schmelzen|Rahm schlagen|Mischen und kalt stellen'],
['Beeren-Crêpes','Dessert',25,5,'1519676867240-f03562e64548','Vegetarisch','Gluten,Milch,Eier','Mehl:80:g|Milch:150:ml|Eier:1:Stück|Beeren:100:g','Teig verrühren|Crêpes ausbacken|Mit Beeren servieren'],
['Fruchtsalat','Dessert',10,4,'1490474418585-ba9bad8fd0ea','Vegan','','Apfel:1:Stück|Banane:1:Stück|Beeren:100:g','Früchte schneiden|Vermischen|Frisch servieren'],
['Vanillejoghurt','Dessert',8,4,'1488477181946-6428a0291777','Vegetarisch','Milch','Joghurt:180:g|Beeren:120:g|Vanillezucker:10:g','Joghurt verrühren|Beeren dazugeben|Servieren'],
['Linsen mit Reis','Mittagessen',25,2,'','Vegan','','Rote Linsen:80:g|Reis:80:g|Karotten:100:g','Reis nach Packungsanleitung kochen|Karotten würfeln und mit den Linsen in Wasser weich kochen|Linsen abschmecken und mit Reis servieren'],
['Pasta mit Tomatensauce','Mittagessen',20,2.5,'','Vegan','Gluten','Pasta:120:g|Passierte Tomaten:180:g|Karotten:80:g','Pasta nach Packungsanleitung kochen|Karotten fein raffeln und in den passierten Tomaten weich köcheln|Sauce abschmecken und mit der Pasta mischen'],
['Kartoffeln mit Kichererbsen','Abendessen',35,2.5,'','Vegan','','Kartoffeln:300:g|Kichererbsen:150:g|Karotten:100:g','Kartoffeln und Karotten würfeln und bei 200 °C mit etwas Öl rösten|Vorgegarte Kichererbsen abspülen und für die letzten 10 Minuten dazugeben|Abschmecken und servieren'],
['Linsen-Kartoffel-Eintopf','Abendessen',30,2,'','Vegan','','Rote Linsen:80:g|Kartoffeln:250:g|Karotten:100:g','Kartoffeln und Karotten klein schneiden|Mit den Linsen in Wasser weich köcheln|Abschmecken und heiss servieren']
];
const R=raw.map((a,i)=>({id:i+1,name:a[0],meal:a[1],min:a[2],cost:a[3],img:a[4]?'https://images.unsplash.com/photo-'+a[4]+'?w=800&q=75':'',diet:a[5],allergens:a[6]?a[6].split(','):[],ingredients:a[7].split('|').map(v=>{const p=v.split(':');return {name:p[0],qty:Number(p[1]),unit:p[2]}}),steps:a[8].split('|')}));
const KEY='mealio-profiles-v1';
const SESSION=KEY+':session';
function readLocal(key){
try{return localStorage.getItem(key);}catch{return null;}
}
function writeLocal(key,value){
try{localStorage.setItem(key,value);return true;}catch{return false;}
}
let profile=readLocal(SESSION)||'';
function profileKey(email){return KEY+':profile:'+email;}
function loadProfile(email){
try{return JSON.parse(readLocal(profileKey(email))||'null');}catch{return null;}
}
let account=profile&&profile!=='guest'?loadProfile(profile):null;
if(profile!=='guest'&&!account)profile='';
let formError='';
const defaults=()=>({setup:false,name:'',diet:'Alles',allergies:[],dislikes:[],cuisines:[],store:'Coop',people:2,days:[...DAYS],meals:['Mittagessen','Abendessen'],budget:180,occasion:'Kein besonderer Anlass',occasionDay:'Samstag',weekStart:'',pendingWeek:'',plan:{},liked:[],lastLiked:[],checks:{}});
let data=defaults();try{const old=JSON.parse((profile==='guest'?readLocal(KEY+':guest')??readLocal('mealio-v4'):readLocal(profileKey(profile)+':plan'))||'null');if(old&&typeof old==='object'){data={...data,...old};for(const k of ['allergies','dislikes','cuisines','days','meals','liked','lastLiked'])if(!Array.isArray(data[k]))data[k]=[];for(const k of ['plan','checks'])if(!data[k]||typeof data[k]!=='object')data[k]={};}}catch(e){}
data.name=typeof data.name==='string'?data.name:'';
data.people=Math.max(1,Math.min(20,Math.trunc(Number(data.people))||2));
data.budget=Math.max(10,Math.min(800,Number(data.budget)||180));
if(!/^\d{4}-\d{2}-\d{2}$/.test(data.weekStart)||!Number.isFinite(+parseDate(data.weekStart)))data.weekStart='';
let weekSnapshot=null, assignReturn='manual';
if(account){data.name=data.name||account.name;if(!data.setup)data.people=Math.min(20,1+account.children);}
let view=profile&&data.setup?'home':profile?'wizard':'intro',flow='intro',step=account?1:0,category=0,cardIndex=0,recipeId=null,returnView='plan',assignKey=null;
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'CHF '+Number(n).toFixed(2);const save=()=>{
if(!profile)return;
const key=profile==='guest'?KEY+':guest':profileKey(profile)+':plan';
writeLocal(key,JSON.stringify(weekSnapshot ? {...data,...weekSnapshot} : data));
};
const button=(label,action,cls='')=>`<button class="${cls}" data-action="${esc(action)}">${label}</button>`;

function monday(d=new Date()){
const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
x.setDate(x.getDate()-(x.getDay()+6)%7);
return x;
}
function iso(d){
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s){
const a=s.split('-').map(Number);
return new Date(a[0],a[1]-1,a[2]);
}
function weekLabel(s){
const a=parseDate(s),b=new Date(a);
b.setDate(b.getDate()+6);
return a.toLocaleDateString('de-CH',{day:'numeric',month:'short'})+' – '+b.toLocaleDateString('de-CH',{day:'numeric',month:'short',year:'numeric'});
}
function setValue(k,v){
data[k]=v;save();render();
}
function toggle(k,v){
const a=data[k]||[];
data[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v];
save();render();
}
function chips(k,arr){
return arr.map(v=>`<button class="chip ${data[k].includes(v)?'active':''}" data-toggle="${esc(k)}" data-value="${esc(v)}">${esc(v)} ${data[k].includes(v)?'✓':''}</button>`).join('');
}
function options(k,arr){
return arr.map(v=>`<button class="choice ${data[k]===v?'active':''}" data-set="${esc(k)}" data-value="${esc(v)}">${esc(v)} ${data[k]===v?'✓':''}</button>`).join('');
}
function progress(i,n){
return `<div class="eyebrow">Schritt ${i+1} von ${n}</div><div class="progress"><div style="width:${Math.round((i+1)/n*100)}%"></div></div>`;
}
function safe(r){
if(r.allergens.some(x=>data.allergies.includes(x)))return false;
if(data.diet==='Vegetarisch'&&['Fleisch','Fisch'].includes(r.diet))return false;
if(data.diet==='Vegan'&&r.diet!=='Vegan')return false;
if(data.diet==='Laktosefrei'&&r.allergens.includes('Milch'))return false;
if(data.diet==='Glutenfrei'&&r.allergens.includes('Gluten'))return false;
const text=(r.name+' '+r.ingredients.map(x=>x.name).join(' ')).toLowerCase();
return !data.dislikes.some(x=>text.includes(x.toLowerCase()));
}
function activeMeals(){
return MEALS.filter(x=>data.meals.includes(x));
}
function slots(){
return DAYS.filter(d=>data.days.includes(d)).flatMap(day=>activeMeals().map(meal=>({day,meal,key:day+'|'+meal})));
}
function go(v){
view=v;render();
}
function leaveWeek(){
if(!weekSnapshot)return;
Object.assign(data,weekSnapshot);
weekSnapshot=null;
}
function startIntro(){
flow='intro';step=account?1:0;view='wizard';render();
}
function openProfile(email){
if(!writeLocal(SESSION,email)){
formError='Der Browser kann keine lokalen Profile speichern. Öffne die Datei in einem Browser mit aktiviertem Webspeicher.';
render();
return;
}
location.reload();
}
function startWeek(){
leaveWeek();
const fields=['store','people','days','meals','budget','occasion','occasionDay','pendingWeek','liked'];
weekSnapshot=Object.fromEntries(fields.map(key=>[key,data[key]]));
flow='week';step=0;view='wizard';
let start=monday();
if(data.weekStart){
const next=parseDate(data.weekStart);
next.setDate(next.getDate()+7);
if(next>start)start=next;
}
data.pendingWeek=iso(start);
data.liked=[];
save();render();
}
function introSteps(){
return [
['Willkommen bei Mealio','Wie dürfen wir dich nennen?'],
['Deine Ernährung','Wie ernährst du dich?'],
['Allergien','Welche Allergien oder Unverträglichkeiten hast du?'],
['Abneigungen','Welche Lebensmittel magst du nicht?'],
['Lieblingsküchen','Welche Küchen magst du besonders?']
];
}
function weekSteps(){
return [
['Supermarkt','Wo möchtest du einkaufen?'],
['Personen','Für wie viele Personen kochst du?'],
['Wochentage','An welchen Tagen möchtest du einen Essensplan?'],
['Mahlzeiten','Welche Mahlzeiten möchtest du planen?'],
['Wochenbudget','Wie viel möchtest du ausgeben?'],
['Besonderer Anlass','Gibt es diese Woche ein besonderes Essen?'],
['Rezepte','Möchtest du gleiche oder neue Rezepte?']
];
}
function wizard(){
const first=flow==='intro';
const steps=first?introSteps():weekSteps();
let html='';
if(first){
if(step===0)html=`<label class="field">Dein Vorname</label><input data-input="name" value="${esc(data.name)}" placeholder="Vorname">`;
if(step===1)html=options('diet',DIETS);
if(step===2)html=chips('allergies',ALLERGIES);
if(step===3)html=chips('dislikes',DISLIKES);
if(step===4)html=chips('cuisines',CUISINES);
}else{
if(step===0)html=options('store',STORES);
if(step===1)html=`<div class="row" style="justify-content:center;margin:25px 0">${button('−','peopleMinus','alt')}<div class="big" style="min-width:75px">${data.people}</div>${button('+','peoplePlus','alt')}</div>`;
if(step===2)html=chips('days',DAYS);
if(step===3)html=chips('meals',MEALS);
if(step===4){
const minimum=data.days.length*10;
html=`<div class="big" id="budgetValue">${money(data.budget)}</div>
<input aria-label="Wochenbudget" type="range" min="${minimum}" max="800" step="10" value="${data.budget}" data-input="budget">
<p class="muted">Mindestbudget für ${data.days.length} ${data.days.length===1?'Tag':'Tage'}: ${money(minimum)}.</p>`;
}
if(step===5){
html=options('occasion',OCCASIONS);
if(data.occasion!=='Kein besonderer Anlass'){
html+=`<label class="field">An welchem Tag?</label><select data-input="occasionDay">${DAYS.map(d=>`<option value="${esc(d)}" ${data.occasionDay===d?'selected':''}>${esc(d)}</option>`).join('')}</select>`;
}
}
if(step===6)html=`
<button class="choice" data-action="sameRecipes"><b>🔁 Gleiche Rezepte</b><br><small>Gerichte aus der letzten Woche übernehmen</small></button>
<button class="choice" data-action="newRecipes"><b>✨ Neue Rezepte</b><br><small>Rezeptbilder ansehen und nach links oder rechts wischen</small></button>`;
}
const bottom=step===6&&!first
?button('← Zurück','backWizard','alt')
:`<div class="row" style="margin-top:22px">${button('← Zurück','backWizard','alt')}${button(step===steps.length-1?'Fertig ✓':'Weiter →','advanceWizard','grow')}</div>`;
return `<div class="card">${progress(first&&account?step-1:step,first&&account?steps.length-1:steps.length)}<h1>${steps[step][0]}</h1><p class="muted">${steps[step][1]}</p>${html}${bottom}${first&&step===2?'<p class="note">Die Allergieprüfung ist eine unvollständige Demo. Bitte Zutaten und Verpackungen immer selbst kontrollieren.</p>':''}</div>`;
}
function backWizard(){
if(step>(flow==='intro'&&account?1:0)){step--;render();return;}
leaveWeek();view=flow==='intro'?'intro':'home';render();
}
function advanceWizard(){
if(flow==='intro'&&step===0&&!data.name.trim()){
alert('Bitte gib deinen Vornamen ein.');return;
}
if(flow==='week'&&step===2&&!data.days.length){
alert('Wähle mindestens einen Tag.');return;
}
if(flow==='week'&&step===3&&!data.meals.length){
alert('Wähle mindestens eine Mahlzeit.');return;
}
if(flow==='intro'&&step===4){
data.setup=true;save();startWeek();return;
}
if(flow==='week'&&step===6)return;
if(flow==='week'&&step===3)data.budget=Math.max(data.days.length*10,Math.round(data.budget/10)*10);
step++;render();
}
function newRecipes(){
data.liked=[];category=0;cardIndex=0;
view='swipe';save();render();
}
function sameRecipes(){
const previous=R.filter(r=>data.lastLiked.includes(r.id)&&activeMeals().includes(r.meal)&&safe(r));
if(!previous.length){
alert('Du hast noch keine Rezepte aus einer früheren Woche. Wähle zuerst neue Rezepte.');
newRecipes();return;
}
data.liked=previous.map(r=>r.id);
save();view='arrange';render();
}
function categories(){
return activeMeals().map(meal=>({
meal,recipes:R.filter(r=>r.meal===meal&&safe(r))
}));
}
function swipe(){
const cats=categories();
while(category<cats.length&&cardIndex>=cats[category].recipes.length){
category++;cardIndex=0;
}
if(category>=cats.length){
view='arrange';return arrange();
}
const c=cats[category],r=c.recipes[cardIndex];

function affordablePlan(){
const pools=new Map(activeMeals().map(meal=>[
meal,R.filter(r=>r.meal===meal&&safe(r)).sort((a,b)=>a.cost-b.cost)
]));
const entries=slots().map(slot=>({...slot,pool:pools.get(slot.meal)}));
const missing=activeMeals().filter(meal=>!pools.get(meal).length);
if(missing.length)return {error:'Keine passenden Rezepte für '+missing.join(', ')+'. Ändere die Mahlzeiten oder deine Rezeptfilter.'};
let cost=entries.reduce((sum,entry)=>sum+entry.pool[0].cost*data.people,0);
if(cost>data.budget)return {error:'Mit diesen Einstellungen kostet der günstigste vollständige Plan geschätzt '+money(cost)+'. Erhöhe das Budget oder passe Tage, Personen oder Mahlzeiten an.'};
const plan={};
const occurrences={};
for(const {key,meal,pool} of entries){
const used=occurrences[meal]||0;
const fits=r=>cost+(r.cost-pool[0].cost)*data.people<=data.budget;
const preferred=pool.filter(r=>data.liked.includes(r.id)&&fits(r));
const choices=preferred.length?preferred:pool.filter(fits);
const recipe=choices[used%choices.length];
plan[key]=recipe.id;
cost+=(recipe.cost-pool[0].cost)*data.people;
occurrences[meal]=used+1;
}
return {plan};
}

async function passwordVerifier(password,salt){
const encoder=new TextEncoder();
const key=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveBits']);
const bytes=await crypto.subtle.deriveBits({
name:'PBKDF2',salt:new Uint8Array(salt),iterations:600000,hash:'SHA-256'
},key,256);
return Array.from(new Uint8Array(bytes)).join('.');
}
async function submitProfile(form){
const register=view==='register';
const fields=new FormData(form);
const email=String(fields.get('email')).trim().toLowerCase();
const password=String(fields.get('password'));
const existing=loadProfile(email);
const error=form.querySelector('[role="alert"]');
const submit=form.querySelector('[type="submit"]');
error.textContent='';
submit.disabled=true;
try{
if(!register){
if(!existing||await passwordVerifier(password,existing.salt)!==existing.verifier){
error.textContent='E-Mail-Adresse oder Passwort stimmt nicht.';
return;
}
if(form.isConnected)openProfile(email);
return;
}
const name=String(fields.get('name')).trim();
if(!name){error.textContent='Bitte gib einen Vornamen ein.';return;}
if(existing){error.textContent='Für diese E-Mail gibt es bereits ein Profil. Wähle «Anmelden».';return;}
const birthday=String(fields.get('birthday'));
const children=Number(fields.get('children'));
const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));
const verifier=await passwordVerifier(password,salt);
if(!form.isConnected)return;
if(loadProfile(email)){error.textContent='Für diese E-Mail gibt es bereits ein Profil.';return;}
if(!writeLocal(profileKey(email),JSON.stringify({name,birthday,children,salt,verifier}))){
error.textContent='Der Browser konnte das Profil nicht speichern.';
return;
}
openProfile(email);
}catch{
error.textContent='Das Profil konnte nicht geöffnet oder gespeichert werden. Prüfe, ob du Mealio über HTTPS mit aktiviertem Webspeicher geöffnet hast.';
}finally{
submit.disabled=false;
}
}

function enableSwipe(){
const el=$('swipeCard');
if(!el)return;
let startX=0,startY=0;
el.addEventListener('touchstart',e=>{
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
},{passive:true});
el.addEventListener('touchend',e=>{
const dx=e.changedTouches[0].clientX-startX;
const dy=e.changedTouches[0].clientY-startY;
if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3){
rate(dx>0);
}
},{passive:true});
}
function runAction(action){
if(action==='guest'){
profile='guest';
account=null;
const previousGuest=readLocal(KEY+':guest');
if(previousGuest||readLocal('mealio-v4')){openProfile('guest');return;}
writeLocal(SESSION,'guest');
return startIntro();
}
if(action==='signOut'){
leaveWeek();
if(writeLocal(SESSION,''))location.reload();
return;
}
if(action==='startIntro')return startIntro();
if(action==='startWeek')return startWeek();
if(action==='reviseWeek'){
startWeek();
data.pendingWeek=data.weekStart;
return;
}
if(action==='backWizard')return backWizard();
if(action==='advanceWizard')return advanceWizard();
if(action==='newRecipes')return newRecipes();
if(action==='editWeek'){
step=3;
return go('wizard');
}
if(action==='sameRecipes')return sameRecipes();
if(action==='rateYes')return rate(true);
if(action==='rateNo')return rate(false);
if(action==='backSwipe')return backSwipe();
if(action==='finishAuto')return finishPlan('auto');
if(action==='finishManual')return finishPlan('manual');
if(action==='copyShop')return copyShop();
if(action==='print')return window.print();
if(action==='peopleMinus')return setValue('people',Math.max(1,data.people-1));
if(action==='peoplePlus')return setValue('people',Math.min(20,data.people+1));
if(action.startsWith('go:'))return go(action.slice(3));
if(action.startsWith('assign:')){
assignReturn=view;
assignKey=action.slice(7);
return go('assign');
}
if(action.startsWith('choose:')){
if(!assignKey)return go('plan');
const recipe=R.find(r=>r.id===Number(action.slice(7))&&safe(r)&&r.meal===assignKey.split('|')[1]);
const current=R.find(r=>r.id===data.plan[assignKey]);
if(!recipe||total()+(recipe.cost-(current?.cost||0))*data.people>data.budget)return;
data.plan[assignKey]=recipe.id;
save();
return go(assignReturn);
}
if(action.startsWith('details:')){
return showDetails(Number(action.slice(8)),view);
}
}

});
document.addEventListener('input',event=>{
const key=event.target.dataset.input;
if(!key)return;
if(key==='budget'){
data.budget=Number(event.target.value);
save();
$('budgetValue').textContent=money(data.budget);
return;
}
data[key]=event.target.value;
save();
});
document.addEventListener('change',event=>{
if(event.target.dataset.check){
data.checks[event.target.dataset.check]=event.target.checked;
save();
render();
}
if(event.target.dataset.input==='occasionDay'){
data.occasionDay=event.target.value;
save();
}
});
$('topSettings').addEventListener('click',()=>{leaveWeek();go('settings');});
window.addEventListener('error',event=>{
console.error('Mealio Fehler:',event.message);
});
render();
</script>
</body>
</html>
